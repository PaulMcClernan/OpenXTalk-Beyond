# The extension packages of the xTalk Assistant and the xTalk MCP Bridge
# for other xTalks' IDEs (tools/plugins), on every pull request and push to
# main that changes them, in a few minutes on one Linux runner:
#
#   - tools/plugins/build-plugin-packages.py builds both .lce packages from
#     ide/Extensions and checks them as the Extension Manager does;
#   - every script-only stack in them is compiled by LiveCode Community
#     9.6.3's own engine (its server build, from the repository variable
#     LCC_SERVER_URL, when it is set), with
#     tools/plugins/stock-compile-check.lc, so that syntax only
#     OXT-Beyond's engine knows is found here and not by someone
#     installing a package;
#   - the packages are uploaded as the run's artifact, to install in
#     LiveCode Community 9.6.3, HyperXTalk or OpenXTalk for testing.
#
# The compatibility stack's behaviour is tested by tests/lcs/plugins in the
# build workflows, the builder by tools/ci/tests (ci-checks.yml).

name: Plugin packages

on:
  push:
    branches: [ main ]
    paths: &plugin-paths
      - '.github/workflows/plugin-packages.yml'
      - 'ide/.version'
      - 'ide/Extensions/org.openxtalk.plugin.mcpbridge/**'
      - 'ide/Extensions/org.openxtalk.plugin.xtalkassistant/**'
      - 'tools/plugins/**'
  pull_request:
    branches: [ main ]
    paths: *plugin-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-packages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  packages:
    name: Build and check the packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the packages
        run: |
          python3 tools/plugins/build-plugin-packages.py --out "$RUNNER_TEMP/packages"
          python3 tools/plugins/build-plugin-packages.py --check "$RUNNER_TEMP"/packages/*.lce
          for package in "$RUNNER_TEMP"/packages/*.lce; do
            name="$(basename "$package" .lce)"
            mkdir -p "$RUNNER_TEMP/unpacked/$name"
            unzip -q "$package" -d "$RUNNER_TEMP/unpacked/$name"
          done
          echo "VERSION=$(cat ide/.version)" >> "$GITHUB_ENV"

      # LiveCode Community 9.6.3's server engine, from the repository
      # variable LCC_SERVER_URL (a zip with livecode-server in it) and
      # checked against LCC_SERVER_SHA256 when that is set. LiveCode Ltd no
      # longer serves the Community builds (downloads.livecode.com answers
      # with a page, 2026-10-14), so there is no public copy to fetch: until
      # the variable names one, the compile on the stock engine is skipped,
      # and the packages are still built, checked and uploaded.
      - name: Fetch LiveCode Community 9.6.3 (server engine)
        if: vars.LCC_SERVER_URL != ''
        env:
          LCC_SERVER_URL: ${{ vars.LCC_SERVER_URL }}
          LCC_SERVER_SHA256: ${{ vars.LCC_SERVER_SHA256 }}
        run: |
          zip="$RUNNER_TEMP/lcc-server.zip"
          curl -sSfL --retry 3 -o "$zip" "$LCC_SERVER_URL"
          sha256sum "$zip"
          if [ -n "$LCC_SERVER_SHA256" ]; then
            echo "$LCC_SERVER_SHA256  $zip" | sha256sum -c -
          fi
          if ! unzip -tq "$zip" >/dev/null 2>&1; then
            echo "::error::LCC_SERVER_URL is not a zip ($(file -b "$zip" | cut -c1-60))"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/lcc-server"
          unzip -q "$zip" -d "$RUNNER_TEMP/lcc-server"
          server="$(find "$RUNNER_TEMP/lcc-server" -type f -name 'livecode-server' | head -n 1)"
          if [ -z "$server" ]; then
            echo "::error::no livecode-server in the download"
            find "$RUNNER_TEMP/lcc-server" -maxdepth 2
            exit 1
          fi
          chmod +x "$server"
          echo "LCC_SERVER=$server" >> "$GITHUB_ENV"

      - name: Compile the packages' scripts on LiveCode Community 9.6.3
        if: vars.LCC_SERVER_URL != ''
        run: |
          "$LCC_SERVER" tools/plugins/stock-compile-check.lc "$RUNNER_TEMP/unpacked" | tee "$RUNNER_TEMP/stock-compile.log"
          status="${PIPESTATUS[0]}"
          grep '^ERROR ' "$RUNNER_TEMP/stock-compile.log" | while read -r line; do
            echo "::error::${line#ERROR }"
          done
          grep -q '^SUMMARY ' "$RUNNER_TEMP/stock-compile.log" || { echo "::error::the check did not finish"; exit 1; }
          exit "$status"

      - name: Say the stock engine's compile was skipped
        if: vars.LCC_SERVER_URL == ''
        run: |
          echo "::notice::Not compiled on LiveCode Community 9.6.3: set the repository variable LCC_SERVER_URL to a zip of its server engine"

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xtalk-plugins-${{ env.VERSION }}
          path: ${{ runner.temp }}/packages/*.lce
          if-no-files-found: error
          retention-days: 30
