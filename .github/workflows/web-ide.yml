# Screenshots of the web IDE (tools/web-ide/README.md): the IDE in a web
# page, opened in headless Chromium and walked through its windows by
# tools/ci/web_ide_tour.py (the Property Inspector, the Script Editor, the
# Message Box, an answer dialog in browse mode, the Dictionary, ...). A
# script error in the IDE, a step that fails, or a page that does not open
# fails the check. The screenshots are uploaded with a page that shows them
# (the artifact web-ide-screenshots, which the job summary links).
#
# The site is built as tools/ci/build-web-ide.sh builds it, from:
#   - the web IDE's engine (engine.gyp's javascriptify-development), built
#     from the checkout with Emscripten in the job Web IDE engine, in the
#     Ubuntu 22.04 container and with the caches of web.yml (the Emscripten
#     SDK and the libraries, the same entries; the compiler's cache, its
#     own, which starts from web.yml's). The engine is kept in a cache of
#     its own, keyed like web.yml's runtime by the git trees it is built
#     from, so a change to the IDE's scripts alone builds nothing;
#   - the Linux x86_64 package of the newest release (or the input tag), for
#     the IDE's binary stacks, extensions and Dictionary, with this
#     checkout's script-only IDE stacks over them (build_site.py --repo),
#     so the screenshots show the IDE's scripts as they are in the commit.
#
# The same site is also kept open for a while in headless WebKit and
# Chromium by tools/ci/web_ide_soak.py (the job Web IDE soak), which records
# the browser's memory and processor use over time and fails if the
# browser's web process crashes or the page loads itself again: Safari
# reloads a page whose web process it kills, and the record (the artifact
# web-ide-soak-<browser>) shows how the page uses memory as it runs.
#
# The job Web IDE download zips the same site, with a small web server
# and a README beside it (build_site.py --zip), as the artifact
# OXT-Beyond-web-ide: OXT-Beyond-<version>-web-ide.zip and its SHA256SUMS,
# for anyone who wants to run the web IDE on their own computer or put it
# on their own web server.
#
# It runs on a pull request or a push to main that changes the IDE, the web
# IDE or the web engine's own files, and by hand. Nothing else waits on it
# there, and it changes nothing in the builds.
#
# Releases: .github/workflows/release.yml calls this workflow
# (workflow_call) with the input release, and publishes the artifact
# OXT-Beyond-web-ide with the platforms' packages
# (tools/ci/release_assets.py). A called release run builds the engine and
# the download zip only (the screenshots, the soak and the xTalk Suite
# check are left to the runs above), and takes the IDE from the release's
# own Linux x86_64 package
# (the artifact OXT-Beyond-linux-x86_64 of the input linux-run, or of the
# caller's run when it is empty) as it is, with no checkout's scripts over
# it, as build-linux.yml builds the Stack Player from the package's IDE.

name: Web IDE screenshots

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/web-ide.yml
      - tools/ci/web_ide_tour.py
      - tools/ci/web_ide_soak.py
      - tools/ci/retry_check.py
      - tools/ci/web-ide-tour.livecodescript
      - tools/ci/build-web-ide.sh
      - tools/ci/build-web.sh
      - tools/web-ide/**
      - tools/ci/web-ide-xtalk.livecodescript
      - tools/ci/nostr_test_relay.py
      - tools/oxt/xtalk-extensions.json
      - util/emscripten-javascriptify.py
      - ide/**
      - ide-support/**
      - extensions/script-libraries/**
      - engine/engine.gyp
      - engine/kernel-development.gyp
      - engine/src/em-*
      - engine/src/mode_development.cpp
      - config/emscripten-version
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/web-ide.yml
      - tools/ci/web_ide_tour.py
      - tools/ci/web_ide_soak.py
      - tools/ci/retry_check.py
      - tools/ci/web-ide-tour.livecodescript
      - tools/ci/build-web-ide.sh
      - tools/ci/build-web.sh
      - tools/web-ide/**
      - tools/ci/web-ide-xtalk.livecodescript
      - tools/ci/nostr_test_relay.py
      - tools/oxt/xtalk-extensions.json
      - util/emscripten-javascriptify.py
      - ide/**
      - ide-support/**
      - extensions/script-libraries/**
      - engine/engine.gyp
      - engine/kernel-development.gyp
      - engine/src/em-*
      - engine/src/mode_development.cpp
      - config/emscripten-version
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose Linux package the site takes its IDE from (for example v0.2.6); empty for the latest one
        type: string
        default: ''
  workflow_call:
    inputs:
      release:
        description: >-
          Build the download zip for a release, from the release's own
          Linux x86_64 package, and nothing else (see the header)
        type: boolean
        required: false
        default: false
      linux-run:
        description: >-
          The run whose artifact OXT-Beyond-linux-x86_64 holds the release's
          Linux package (main's build of the commit); empty for the caller's
          run
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # A called release run gets a group of its own, the caller's run id, as
  # the build workflows do: pushes to the branch of a dry run must neither
  # cancel it nor wait for it
  group: web-ide-${{ inputs.release && format('release-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

defaults:
  run:
    shell: bash

jobs:
  engine:
    name: Web IDE engine
    runs-on: ubuntu-24.04
    # As web.yml: Ubuntu 22.04 through Google's mirror of Docker Hub, for
    # the Python 2.7 that gyp needs
    container:
      image: mirror.gcr.io/library/ubuntu:22.04
    timeout-minutes: 150
    env:
      DEBIAN_FRONTEND: noninteractive
      # web.yml's, so that the packages' cache is the same entry
      BUILD_PKGS: >-
        build-essential gcc g++ make perl bison flex gawk pkg-config
        python2 python3 git curl ca-certificates
        bzip2 xz-utils zstd zip unzip file ccache
      EMSDK: /opt/emsdk
      # web.yml's EMSDK_COMMIT (see there)
      EMSDK_COMMIT: 35ff8a6d150541276abbc6bae512ca90bcfbe220
      CCACHE_DIR: /opt/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Compute the build tools cache key
        id: apt-key
        run: |
          hash=$(printf '%s\n' 'mirror.gcr.io/library/ubuntu:22.04' "$BUILD_PKGS" | sha256sum | cut -c1-16)
          echo "key=apt-jammy-web-$(date -u +%Y-%m)-${hash}" >> "$GITHUB_OUTPUT"

      - name: Restore the build tools' packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /var/cache/apt/archives/*.deb
            /var/lib/apt/lists
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install build tools
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          if [ "$CACHE_HIT" != true ]; then
            apt-get -o Acquire::Retries=3 update
          fi
          # shellcheck disable=SC2086 # BUILD_PKGS is a list
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends $BUILD_PKGS
          # gyp and config.py run "python", which must be Python 2.7
          ln -sf /usr/bin/python2 /usr/local/bin/python
          echo "Processors: $(nproc)"

      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # engine: the engine's cache key, from the same trees as web.yml's
      # runtime and this workflow's build steps; libraries: web.yml's key
      - name: Compute the cache keys
        id: keys
        run: |
          version=$(head -n 1 config/emscripten-version | tr -d '[:space:]')
          if [ -z "$version" ]; then echo "::error::config/emscripten-version is empty"; exit 1; fi
          echo "emscripten=$version" >> "$GITHUB_OUTPUT"
          sources=$(git ls-tree HEAD | awk -F '\t' '$2 !~ /^(ide|ide-support|docs|tests|tools|Installer|\.github|.*\.md)$/' |
                      sha256sum | cut -c1-16)
          # (with the xTalk Suite libraries it links, EXPERIMENTAL: their pins
          # and the tool that fetches them)
          script=$(cat tools/ci/build-web.sh .github/workflows/web-ide.yml tools/oxt/xtalk-extensions.json \
                       tools/web-ide/xtalk_web_libraries.py | sha256sum | cut -c1-12)
          echo "engine=web-ide-engine-jammy-${sources}-${script}" >> "$GITHUB_OUTPUT"
          scripts=$(cat prebuilt/versions/* prebuilt/scripts/*.sh prebuilt/scripts/*.inc \
                        prebuilt/build-libraries.sh prebuilt/*.gyp config/*.gypi \
                        config/emscripten-version tools/ci/build-web.sh | sha256sum | cut -c1-16)
          thirdparty=$(git rev-parse HEAD:thirdparty | cut -c1-12)
          echo "libraries=prebuilt-web-jammy-${scripts}-${thirdparty}" >> "$GITHUB_OUTPUT"

      - name: Restore the engine
        id: engine-cache
        uses: actions/cache/restore@v6
        with:
          path: web-ide-engine
          key: ${{ steps.keys.outputs.engine }}

      - name: Restore the Emscripten SDK
        id: emsdk-cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /opt/emsdk
          key: emsdk-jammy-${{ steps.keys.outputs.emscripten }}-${{ env.EMSDK_COMMIT }}

      - name: Install the Emscripten SDK
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.emsdk-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.keys.outputs.emscripten }}
        run: |
          git clone --depth 1 --branch "$VERSION" https://github.com/emscripten-core/emsdk.git "$EMSDK"
          commit=$(git -C "$EMSDK" rev-parse HEAD)
          if [ "$commit" != "$EMSDK_COMMIT" ]; then
            echo "::error::emsdk's tag $VERSION is commit $commit, not $EMSDK_COMMIT (EMSDK_COMMIT in web-ide.yml)"
            exit 1
          fi
          "$EMSDK/emsdk" install "$VERSION"
          "$EMSDK/emsdk" activate "$VERSION"

      - name: Restore the libraries
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            prebuilt/lib
            prebuilt/bin
            prebuilt/include
            prebuilt/share
          key: ${{ steps.keys.outputs.libraries }}

      # The newest cache of this workflow, else of web.yml's runtime, which
      # compiles most of the same files
      - name: Restore the compiler cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /opt/ccache
          key: ccache-web-ide-jammy-${{ github.sha }}
          restore-keys: |
            ccache-web-ide-jammy-
            ccache-web-jammy-

      # As tools/ci/build-web-ide.sh builds it (the libraries, which the
      # cache usually has, then the engine), without the site, which the
      # next job makes
      - name: Build the web IDE's engine
        id: build
        if: steps.engine-cache.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: |
          # shellcheck disable=SC1091 # the SDK's own script
          source "$EMSDK/emsdk_env.sh"
          ccache --zero-stats
          tools/ci/build-web.sh --libraries
          export PREBUILT_SKIP_FETCH=1
          # The xTalk Suite's native libraries, linked into this engine only
          # (EXPERIMENTAL; engine/src/em-xtalk-web.cpp), as build-web-ide.sh
          # fetches them
          python3 tools/web-ide/xtalk_web_libraries.py fetch --out build-emscripten/xtalk-web
          make config-emscripten
          # emcc runs its compiler through ccache
          EM_COMPILER_WRAPPER=ccache BUILDTYPE=Release \
            emmake make -C build-emscripten/livecode javascriptify-development -j"$(nproc)"
          ccache --show-stats
          mkdir web-ide-engine
          cp build-emscripten/livecode/out/Release/development-community-*.js \
             build-emscripten/livecode/out/Release/development-community-*.wasm web-ide-engine/

      - name: Save the compiler cache
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /opt/ccache
          key: ccache-web-ide-jammy-${{ github.sha }}

      - name: Save the engine to the cache
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: web-ide-engine
          key: ${{ steps.keys.outputs.engine }}

      - name: List the engine
        run: ls -l web-ide-engine

      - name: Upload the engine
        uses: actions/upload-artifact@v7
        with:
          name: web-ide-engine
          path: web-ide-engine/
          if-no-files-found: error
          retention-days: 7

  tour:
    name: Web IDE screenshots
    needs: engine
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the engine
        uses: actions/download-artifact@v8
        with:
          name: web-ide-engine
          path: ${{ runner.temp }}/web-ide-engine

      # The IDE's binary stacks, extensions and Dictionary, as ui-tour.yml
      # takes a release
      - name: Download the release's Linux package
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$REPO" --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          echo "Release: $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/oxt"
          gh release download "$TAG" --repo "$REPO" --pattern "*-linux-x86_64.tar.xz" --dir "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
          tar -xJf "$RUNNER_TEMP"/dist/*-linux-x86_64.tar.xz -C "$RUNNER_TEMP/oxt"
          home=$(find "$RUNNER_TEMP/oxt" -maxdepth 4 -path '*/Toolset/home.livecodescript' | head -n 1)
          if [ -z "$home" ]; then echo "::error::the package has no Toolset/home.livecodescript"; exit 1; fi
          echo "OXT_ROOT=$(dirname "$(dirname "$home")")" >> "$GITHUB_ENV"

      - name: Build the site
        run: |
          python3 tools/web-ide/build_site.py --install "$OXT_ROOT" \
            --engine "$RUNNER_TEMP/web-ide-engine" --out "$RUNNER_TEMP/site" --repo .

      # Playwright, pinned (web.yml's version), with Chromium
      - name: Install Playwright and Chromium
        env:
          PLAYWRIGHT_VERSION: 1.56.0
        run: |
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/python" -m pip install --quiet "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install --with-deps chromium

      - name: Web IDE screenshots
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/playwright/bin/python" tools/ci/web_ide_tour.py --site "$RUNNER_TEMP/site" \
            --out "$RUNNER_TEMP/web-ide-tour"

      - name: Upload the screenshots
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ide-screenshots
          path: ${{ runner.temp }}/web-ide-tour
          if-no-files-found: ignore
          retention-days: 14

      - name: Link in the summary
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "The IDE's binary stacks and extensions are $RELEASE_TAG's, its scripts this commit's."
            echo
            echo "[Download the screenshots]($URL) (index.html shows them)."
          } >> "$GITHUB_STEP_SUMMARY"

  soak:
    name: Web IDE soak (${{ matrix.browser }})
    needs: engine
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.browser == 'webkit' && 40 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the engine
        uses: actions/download-artifact@v8
        with:
          name: web-ide-engine
          path: ${{ runner.temp }}/web-ide-engine

      # As the screenshots' job
      - name: Download the release's Linux package
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$REPO" --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          echo "Release: $TAG"
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/oxt"
          gh release download "$TAG" --repo "$REPO" --pattern "*-linux-x86_64.tar.xz" --dir "$RUNNER_TEMP/dist"
          tar -xJf "$RUNNER_TEMP"/dist/*-linux-x86_64.tar.xz -C "$RUNNER_TEMP/oxt"
          home=$(find "$RUNNER_TEMP/oxt" -maxdepth 4 -path '*/Toolset/home.livecodescript' | head -n 1)
          if [ -z "$home" ]; then echo "::error::the package has no Toolset/home.livecodescript"; exit 1; fi
          echo "OXT_ROOT=$(dirname "$(dirname "$home")")" >> "$GITHUB_ENV"

      - name: Build the site
        run: |
          python3 tools/web-ide/build_site.py --install "$OXT_ROOT" \
            --engine "$RUNNER_TEMP/web-ide-engine" --out "$RUNNER_TEMP/site" --repo .

      # Playwright, pinned (web.yml's version), with the browser
      - name: Install Playwright and ${{ matrix.browser }}
        env:
          PLAYWRIGHT_VERSION: 1.56.0
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/python" -m pip install --quiet "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install --with-deps "$BROWSER"

      # In WebKit the soak runs a second time if it fails, as web.yml's
      # check does (tools/ci/retry_check.py: the first try's record is
      # kept in try-1 of the uploaded folder, with a warning in the
      # summary), and the step and the job have room for two tries;
      # Chromium runs it once, as before
      - name: Web IDE soak
        timeout-minutes: ${{ matrix.browser == 'webkit' && 25 || 15 }}
        env:
          BROWSER: ${{ matrix.browser }}
          TRIES: ${{ matrix.browser == 'webkit' && 2 || 1 }}
        run: |
          python3 tools/ci/retry_check.py --tries "$TRIES" --files "$RUNNER_TEMP/web-ide-soak" \
            --what "The web IDE soak in $BROWSER" -- \
            "$RUNNER_TEMP/playwright/bin/python" tools/ci/web_ide_soak.py --site "$RUNNER_TEMP/site" \
            --out "$RUNNER_TEMP/web-ide-soak" --browser "$BROWSER" --minutes 8

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ide-soak-${{ matrix.browser }}
          path: ${{ runner.temp }}/web-ide-soak
          if-no-files-found: ignore
          retention-days: 14

  # The xTalk Suite's libraries in the web IDE (EXPERIMENTAL): the engine
  # links SodiumXT, Box2Dxt and CoinXT, and tools/ci/web-ide-xtalk.livecodescript
  # calls them through the IDE's extensions, runs xTalk Chat against a local
  # Nostr relay, Hold'em's self-test and the Box2Dxt platformer, in each
  # browser (its header lists the checks). The apps and NostrXT's relay
  # library (with its browser transport) come from the suite at the commit
  # the libraries are pinned at.
  xtalk:
    name: Web IDE xTalk Suite (${{ matrix.browser }})
    needs: engine
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the engine
        uses: actions/download-artifact@v8
        with:
          name: web-ide-engine
          path: ${{ runner.temp }}/web-ide-engine

      # As the screenshots' job
      - name: Download the release's Linux package
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$REPO" --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          echo "Release: $TAG"
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/oxt"
          gh release download "$TAG" --repo "$REPO" --pattern "*-linux-x86_64.tar.xz" --dir "$RUNNER_TEMP/dist"
          tar -xJf "$RUNNER_TEMP"/dist/*-linux-x86_64.tar.xz -C "$RUNNER_TEMP/oxt"
          home=$(find "$RUNNER_TEMP/oxt" -maxdepth 4 -path '*/Toolset/home.livecodescript' | head -n 1)
          if [ -z "$home" ]; then echo "::error::the package has no Toolset/home.livecodescript"; exit 1; fi
          echo "OXT_ROOT=$(dirname "$(dirname "$home")")" >> "$GITHUB_ENV"

      - name: Fetch the suite's apps and relay library
        run: python3 tools/web-ide/xtalk_web_libraries.py test-files --out "$RUNNER_TEMP/xtalk-files"

      - name: Build the site
        run: |
          python3 tools/web-ide/build_site.py --install "$OXT_ROOT" \
            --engine "$RUNNER_TEMP/web-ide-engine" --out "$RUNNER_TEMP/site" --repo .

      - name: Install Playwright and ${{ matrix.browser }}
        env:
          PLAYWRIGHT_VERSION: 1.56.0
          BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/python" -m pip install --quiet "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install --with-deps "$BROWSER"

      # In WebKit the check runs a second time if it fails, as web.yml's
      # check does (tools/ci/retry_check.py, with the first try's record
      # kept in try-1 and a warning in the summary): a secp256k1 result
      # checked in the page (a BIP-340 public key or signature) has come
      # out wrong there now and then, at a different step from run to
      # run, where the next run, Chromium and Firefox had it right. A
      # pass takes about two minutes, so the step has room for two tries.
      - name: Web IDE xTalk Suite check
        timeout-minutes: 45
        env:
          BROWSER: ${{ matrix.browser }}
          TRIES: ${{ matrix.browser == 'webkit' && 2 || 1 }}
        run: |
          files="$RUNNER_TEMP/xtalk-files"
          python3 tools/ci/retry_check.py --tries "$TRIES" --files "$RUNNER_TEMP/web-ide-xtalk" \
            --what "The web IDE xTalk Suite check in $BROWSER" -- \
            "$RUNNER_TEMP/playwright/bin/python" tools/ci/web_ide_tour.py --site "$RUNNER_TEMP/site" \
            --out "$RUNNER_TEMP/web-ide-xtalk" --browser "$BROWSER" --timeout 2400 \
            --tour tools/ci/web-ide-xtalk.livecodescript --relay \
            --add "$files/holdem.livecodescript" --add "$files/box2dxt-platformer.livecodescript" \
            --add "$files/datachannel-selftest.livecodescript" \
            --replace "boot/Extensions/nostr-relay/nostr-relay.livecodescript=$files/nostr-relay.livecodescript"

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ide-xtalk-${{ matrix.browser }}
          path: ${{ runner.temp }}/web-ide-xtalk
          if-no-files-found: ignore
          retention-days: 14

  # The site as a zip to download (build_site.py --zip): its folder holds
  # the site's files, serve.py and "Start Web IDE.bat" (a web server for
  # the user's own computer) and a README. Uploaded with a SHA256SUMS, as
  # the artifact OXT-Beyond-web-ide that release.yml publishes
  # (tools/ci/release_assets.py checks it against that file).
  download:
    name: Web IDE download
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # main's build of the release's commit (linux-run)
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the engine
        uses: actions/download-artifact@v8
        with:
          name: web-ide-engine
          path: ${{ runner.temp }}/web-ide-engine

      # A release: its own Linux package, from the caller's run or main's
      # build of the commit (which takes the token; an empty one means
      # this run)
      - name: Download the release's Linux package (release)
        if: inputs.release
        uses: actions/download-artifact@v8
        with:
          name: OXT-Beyond-linux-x86_64
          path: ${{ runner.temp }}/dist
          run-id: ${{ inputs.linux-run || github.run_id }}
          github-token: ${{ inputs.linux-run != '' && github.token || '' }}

      # Otherwise, as the screenshots' job: the newest release's (or the
      # input tag's)
      - name: Download the newest release's Linux package
        if: ${{ !inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$REPO" --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          echo "Release: $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dist"
          gh release download "$TAG" --repo "$REPO" --pattern "*-linux-x86_64.tar.xz" --dir "$RUNNER_TEMP/dist"

      - name: Extract the Linux package
        run: |
          ls -l "$RUNNER_TEMP/dist"
          packages=("$RUNNER_TEMP"/dist/*-linux-x86_64.tar.xz)
          if [ "${#packages[@]}" != 1 ] || [ ! -f "${packages[0]}" ]; then
            echo "::error::expected one *-linux-x86_64.tar.xz, found: ${packages[*]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/oxt"
          tar -xJf "${packages[0]}" -C "$RUNNER_TEMP/oxt"
          home=$(find "$RUNNER_TEMP/oxt" -maxdepth 4 -path '*/Toolset/home.livecodescript' | head -n 1)
          if [ -z "$home" ]; then echo "::error::the package has no Toolset/home.livecodescript"; exit 1; fi
          echo "OXT_ROOT=$(dirname "$(dirname "$home")")" >> "$GITHUB_ENV"

      # A release takes the package's IDE as it is; other runs put this
      # checkout's scripts over the release's, as the screenshots do. The
      # zip is named after ide/.version (a release's tag is v<it>,
      # release.yml checks), the name release_assets.py expects.
      - name: Build the site and its zip
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          version=$(head -n 1 ide/.version | tr -d '[:space:]')
          if [ -z "$version" ]; then echo "::error::ide/.version is empty"; exit 1; fi
          repo=(--repo .)
          if [ "$RELEASE" = true ]; then repo=(); fi
          mkdir -p "$RUNNER_TEMP/download"
          zip="OXT-Beyond-$version-web-ide.zip"
          python3 tools/web-ide/build_site.py --install "$OXT_ROOT" \
            --engine "$RUNNER_TEMP/web-ide-engine" --out "$RUNNER_TEMP/site" "${repo[@]}" \
            --zip "$RUNNER_TEMP/download/$zip"
          # The zip opens, and has the page, the engine, the IDE and the
          # server in its one folder
          python3 - "$RUNNER_TEMP/download/$zip" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          top = path.rsplit('/', 1)[1][:-len('.zip')]
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  sys.exit('%s is damaged in the zip' % bad)
              names = set(z.namelist())
          want = ['index.html', 'ide.zip', 'serve.py', 'Start Web IDE.bat', 'README.txt']
          missing = [n for n in want if top + '/' + n not in names]
          if not any(n.startswith(top + '/development-community-') and n.endswith('.wasm') for n in names):
              missing.append('development-community-<version>.wasm')
          if missing or any(not n.startswith(top + '/') for n in names):
              sys.exit('the zip is not one folder %s/ with the site: missing %s' % (top, missing))
          print('%s: %d files in %s/' % (path, len(names), top))
          PY
          cd "$RUNNER_TEMP/download"
          sha256sum "$zip" > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Upload the zip
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: OXT-Beyond-web-ide
          path: ${{ runner.temp }}/download/
          if-no-files-found: error
          retention-days: ${{ inputs.release && 30 || 14 }}
          # The zip is compressed already
          compression-level: 0

      - name: Link in the summary
        if: steps.upload.outputs.artifact-url != ''
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
          RELEASE: ${{ inputs.release }}
        run: |
          {
            if [ "$RELEASE" = true ]; then
              echo "The IDE is the release's Linux package's, as it is."
            else
              echo "The IDE's binary stacks and extensions are $RELEASE_TAG's, its scripts this commit's."
            fi
            echo
            echo "[Download the web IDE zip]($URL): extract it and run serve.py (or Start Web IDE.bat) in its folder."
          } >> "$GITHUB_STEP_SUMMARY"
