# Screenshots of the web IDE (tools/web-ide/README.md): the IDE in a web
# page, opened in headless Chromium and walked through its windows by
# tools/ci/web_ide_tour.py (the Property Inspector, the Script Editor, the
# Message Box, an answer dialog in browse mode, the Dictionary, ...). A
# script error in the IDE, a step that fails, or a page that does not open
# fails the check. The screenshots are uploaded with a page that shows them
# (the artifact web-ide-screenshots, which the job summary links).
#
# The site is built as tools/ci/build-web-ide.sh builds it, from:
#   - the web IDE's engine (engine.gyp's javascriptify-development), built
#     from the checkout with Emscripten in the job Web IDE engine, in the
#     Ubuntu 22.04 container and with the caches of web.yml (the Emscripten
#     SDK and the libraries, the same entries; the compiler's cache, its
#     own, which starts from web.yml's). The engine is kept in a cache of
#     its own, keyed like web.yml's runtime by the git trees it is built
#     from, so a change to the IDE's scripts alone builds nothing;
#   - the Linux x86_64 package of the newest release (or the input tag), for
#     the IDE's binary stacks, extensions and Dictionary, with this
#     checkout's script-only IDE stacks over them (build_site.py --repo),
#     so the screenshots show the IDE's scripts as they are in the commit.
#
# It runs on a pull request or a push to main that changes the IDE, the web
# IDE or the web engine's own files, and by hand. Nothing else waits on it,
# and it changes nothing in the builds.

name: Web IDE screenshots

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/web-ide.yml
      - tools/ci/web_ide_tour.py
      - tools/ci/web-ide-tour.livecodescript
      - tools/ci/build-web-ide.sh
      - tools/ci/build-web.sh
      - tools/web-ide/**
      - ide/**
      - ide-support/**
      - extensions/script-libraries/**
      - engine/engine.gyp
      - engine/kernel-development.gyp
      - engine/src/em-*
      - engine/src/mode_development.cpp
      - config/emscripten-version
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/web-ide.yml
      - tools/ci/web_ide_tour.py
      - tools/ci/web-ide-tour.livecodescript
      - tools/ci/build-web-ide.sh
      - tools/ci/build-web.sh
      - tools/web-ide/**
      - ide/**
      - ide-support/**
      - extensions/script-libraries/**
      - engine/engine.gyp
      - engine/kernel-development.gyp
      - engine/src/em-*
      - engine/src/mode_development.cpp
      - config/emscripten-version
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose Linux package the site takes its IDE from (for example v0.2.6); empty for the latest one
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: web-ide-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  engine:
    name: Web IDE engine
    runs-on: ubuntu-24.04
    # As web.yml: Ubuntu 22.04 through Google's mirror of Docker Hub, for
    # the Python 2.7 that gyp needs
    container:
      image: mirror.gcr.io/library/ubuntu:22.04
    timeout-minutes: 150
    env:
      DEBIAN_FRONTEND: noninteractive
      # web.yml's, so that the packages' cache is the same entry
      BUILD_PKGS: >-
        build-essential gcc g++ make perl bison flex gawk pkg-config
        python2 python3 git curl ca-certificates
        bzip2 xz-utils zstd zip unzip file ccache
      EMSDK: /opt/emsdk
      # web.yml's EMSDK_COMMIT (see there)
      EMSDK_COMMIT: 35ff8a6d150541276abbc6bae512ca90bcfbe220
      CCACHE_DIR: /opt/ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Compute the build tools cache key
        id: apt-key
        run: |
          hash=$(printf '%s\n' 'mirror.gcr.io/library/ubuntu:22.04' "$BUILD_PKGS" | sha256sum | cut -c1-16)
          echo "key=apt-jammy-web-$(date -u +%Y-%m)-${hash}" >> "$GITHUB_OUTPUT"

      - name: Restore the build tools' packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /var/cache/apt/archives/*.deb
            /var/lib/apt/lists
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install build tools
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          if [ "$CACHE_HIT" != true ]; then
            apt-get -o Acquire::Retries=3 update
          fi
          # shellcheck disable=SC2086 # BUILD_PKGS is a list
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends $BUILD_PKGS
          # gyp and config.py run "python", which must be Python 2.7
          ln -sf /usr/bin/python2 /usr/local/bin/python
          echo "Processors: $(nproc)"

      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # engine: the engine's cache key, from the same trees as web.yml's
      # runtime and this workflow's build steps; libraries: web.yml's key
      - name: Compute the cache keys
        id: keys
        run: |
          version=$(head -n 1 config/emscripten-version | tr -d '[:space:]')
          if [ -z "$version" ]; then echo "::error::config/emscripten-version is empty"; exit 1; fi
          echo "emscripten=$version" >> "$GITHUB_OUTPUT"
          sources=$(git ls-tree HEAD | awk -F '\t' '$2 !~ /^(ide|ide-support|docs|tests|tools|Installer|\.github|.*\.md)$/' |
                      sha256sum | cut -c1-16)
          script=$(cat tools/ci/build-web.sh .github/workflows/web-ide.yml | sha256sum | cut -c1-12)
          echo "engine=web-ide-engine-jammy-${sources}-${script}" >> "$GITHUB_OUTPUT"
          scripts=$(cat prebuilt/versions/* prebuilt/scripts/*.sh prebuilt/scripts/*.inc \
                        prebuilt/build-libraries.sh prebuilt/*.gyp config/*.gypi \
                        config/emscripten-version tools/ci/build-web.sh | sha256sum | cut -c1-16)
          thirdparty=$(git rev-parse HEAD:thirdparty | cut -c1-12)
          echo "libraries=prebuilt-web-jammy-${scripts}-${thirdparty}" >> "$GITHUB_OUTPUT"

      - name: Restore the engine
        id: engine-cache
        uses: actions/cache/restore@v6
        with:
          path: web-ide-engine
          key: ${{ steps.keys.outputs.engine }}

      - name: Restore the Emscripten SDK
        id: emsdk-cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /opt/emsdk
          key: emsdk-jammy-${{ steps.keys.outputs.emscripten }}-${{ env.EMSDK_COMMIT }}

      - name: Install the Emscripten SDK
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.emsdk-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.keys.outputs.emscripten }}
        run: |
          git clone --depth 1 --branch "$VERSION" https://github.com/emscripten-core/emsdk.git "$EMSDK"
          commit=$(git -C "$EMSDK" rev-parse HEAD)
          if [ "$commit" != "$EMSDK_COMMIT" ]; then
            echo "::error::emsdk's tag $VERSION is commit $commit, not $EMSDK_COMMIT (EMSDK_COMMIT in web-ide.yml)"
            exit 1
          fi
          "$EMSDK/emsdk" install "$VERSION"
          "$EMSDK/emsdk" activate "$VERSION"

      - name: Restore the libraries
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            prebuilt/lib
            prebuilt/bin
            prebuilt/include
            prebuilt/share
          key: ${{ steps.keys.outputs.libraries }}

      # The newest cache of this workflow, else of web.yml's runtime, which
      # compiles most of the same files
      - name: Restore the compiler cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /opt/ccache
          key: ccache-web-ide-jammy-${{ github.sha }}
          restore-keys: |
            ccache-web-ide-jammy-
            ccache-web-jammy-

      # As tools/ci/build-web-ide.sh builds it (the libraries, which the
      # cache usually has, then the engine), without the site, which the
      # next job makes
      - name: Build the web IDE's engine
        id: build
        if: steps.engine-cache.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: |
          # shellcheck disable=SC1091 # the SDK's own script
          source "$EMSDK/emsdk_env.sh"
          ccache --zero-stats
          tools/ci/build-web.sh --libraries
          export PREBUILT_SKIP_FETCH=1
          make config-emscripten
          # emcc runs its compiler through ccache
          EM_COMPILER_WRAPPER=ccache BUILDTYPE=Release \
            emmake make -C build-emscripten/livecode javascriptify-development -j"$(nproc)"
          ccache --show-stats
          mkdir web-ide-engine
          cp build-emscripten/livecode/out/Release/development-community-*.js \
             build-emscripten/livecode/out/Release/development-community-*.wasm web-ide-engine/

      - name: Save the compiler cache
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /opt/ccache
          key: ccache-web-ide-jammy-${{ github.sha }}

      - name: Save the engine to the cache
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: web-ide-engine
          key: ${{ steps.keys.outputs.engine }}

      - name: List the engine
        run: ls -l web-ide-engine

      - name: Upload the engine
        uses: actions/upload-artifact@v7
        with:
          name: web-ide-engine
          path: web-ide-engine/
          if-no-files-found: error
          retention-days: 7

  tour:
    name: Web IDE screenshots
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the engine
        uses: actions/download-artifact@v8
        with:
          name: web-ide-engine
          path: ${{ runner.temp }}/web-ide-engine

      # The IDE's binary stacks, extensions and Dictionary, as ui-tour.yml
      # takes a release
      - name: Download the release's Linux package
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$REPO" --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          echo "Release: $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/oxt"
          gh release download "$TAG" --repo "$REPO" --pattern "*-linux-x86_64.tar.xz" --dir "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
          tar -xJf "$RUNNER_TEMP"/dist/*-linux-x86_64.tar.xz -C "$RUNNER_TEMP/oxt"
          home=$(find "$RUNNER_TEMP/oxt" -maxdepth 4 -path '*/Toolset/home.livecodescript' | head -n 1)
          if [ -z "$home" ]; then echo "::error::the package has no Toolset/home.livecodescript"; exit 1; fi
          echo "OXT_ROOT=$(dirname "$(dirname "$home")")" >> "$GITHUB_ENV"

      - name: Build the site
        run: |
          python3 tools/web-ide/build_site.py --install "$OXT_ROOT" \
            --engine "$RUNNER_TEMP/web-ide-engine" --out "$RUNNER_TEMP/site" --repo .

      # Playwright, pinned (web.yml's version), with Chromium
      - name: Install Playwright and Chromium
        env:
          PLAYWRIGHT_VERSION: 1.56.0
        run: |
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/python" -m pip install --quiet "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install --with-deps chromium

      - name: Web IDE screenshots
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/playwright/bin/python" tools/ci/web_ide_tour.py --site "$RUNNER_TEMP/site" \
            --out "$RUNNER_TEMP/web-ide-tour"

      - name: Upload the screenshots
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ide-screenshots
          path: ${{ runner.temp }}/web-ide-tour
          if-no-files-found: ignore
          retention-days: 14

      - name: Link in the summary
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "The IDE's binary stacks and extensions are $RELEASE_TAG's, its scripts this commit's."
            echo
            echo "[Download the screenshots]($URL) (index.html shows them)."
          } >> "$GITHUB_STEP_SUMMARY"
