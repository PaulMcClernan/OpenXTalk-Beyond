# The web IDE (tools/web-ide) and the Stack Player (tools/web-player) on
# the repository's GitHub Pages site, with a front page that links to both
# (tools/pages/build_pages.py), and the codebase map beside them:
#
#   <site>/          the front page (tools/pages/index.html)
#   <site>/ide/      the web IDE
#   <site>/player/   the Stack Player
#   <site>/map/      the codebase map (tools/codebase-map)
#
# Both are taken as a release ships them, from its files
# OXT-Beyond-<version>-web-ide.zip and OXT-Beyond-<version>-web-player.zip,
# so the site is always a released build and this workflow builds neither (the
# map below is the one part it makes).
# The release is the input tag, or else the newest one that is not a draft
# (prereleases count: every 0.2.7 build is one). A release with no web IDE
# zip (those before it was a release file) takes the web IDE from the
# artifact OXT-Beyond-web-ide of the input ide-run (a Web IDE run,
# web-ide.yml, such as a pull request's), or else of the newest successful
# Web IDE run on main; its IDE is a release's with that commit's scripts
# over it. With neither, the site has the Stack Player alone, and the summary says
# so.
#
# A build that is not released yet (a release dry run, or a Linux build of
# the commit to be released) goes on the site with the input build-run: its
# run id. Both zips are then taken from that run's artifacts
# (release-dry-run, OXT-Beyond-linux-x86_64, OXT-Beyond-web-ide), the input
# tag is not used, and a run that lacks either zip fails, so that a site
# with both never loses one. The next release's run puts the released
# files back.
#
# It runs by hand (Actions > Web pages > Run workflow), and the Release
# workflow starts it on main with the tag once it has published a release
# (its job "Web pages"). Releases are made with a workflow's own token,
# and what such a token does starts no other workflow, "release" and
# "workflow_run" events included; starting one by hand is the exception,
# so the release starts it that way. A dry run publishes nothing and starts
# nothing here, so a test build put on the site by hand stays until the
# release. It needs GitHub Pages turned on with "GitHub Actions" as
# its source (Settings > Pages); until then the deploy job fails and
# nothing else is touched. It changes no release, package or build.
#
# The front page's Downloads section links the desktop packages, the web
# zips and the plugins of a release straight to their files, as the forum
# posts do: those of the release put on the site, or of the newest one
# when the site has a build that is not released. Only the files the
# release has are linked (tools/pages/build_pages.py --release-assets);
# a release that cannot be listed leaves the section out, with a warning.
#
# The codebase map is the one part made here, and it is made from the
# source of the commit this run checks out (main's, for the release's run),
# so it is as new as the site. tools/codebase-map/build_map.py reads the
# checkout with its history (hence fetch-depth 0; blob:none fetches no old
# file contents), xtalk-suite's main, and the scripts of the binary IDE
# stacks, which make_dumps.sh writes out with the newest release's Linux
# engine (it opens each stack with messages locked and saves none). d3,
# which the page draws with, comes from npm at a pinned version and
# checksum and is put in the page, so the page needs no other host. Making
# the map is allowed to fail: the site then goes up without it, as before,
# and the summary says so.

name: Web pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release to put on the site (for example v0.2.7-rc.6.1); empty for the newest one
        type: string
        default: ''
      build-run:
        description: >-
          A run whose artifacts hold both web zips, to put a build that is
          not released yet on the site (a release dry run's, or a Linux
          build's with a Web IDE run's); empty for a release
        type: string
        default: ''
      ide-run:
        description: >-
          A Web IDE run (web-ide.yml) whose artifact OXT-Beyond-web-ide to
          use when the release has no web IDE zip, for example a pull
          request's run; empty for main's newest
        type: string
        default: ''

permissions:
  contents: read

# One deploy at a time, and a newer one waits instead of cancelling one
# that has started
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  site:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # the fallback's artifact from web-ide.yml
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The codebase map's history and release tags; blob:none leaves
          # the old file contents on the server
          fetch-depth: 0
          filter: blob:none

      - name: Download the release's web files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Given by hand, or by the release that started this run
          TAG: ${{ inputs.tag }}
          BUILD_RUN: ${{ inputs.build-run }}
          IDE_RUN: ${{ inputs.ide-run }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          if [ -n "$BUILD_RUN" ]; then
            for run in $BUILD_RUN $IDE_RUN; do
              if ! [[ "$run" =~ ^[0-9]+$ ]]; then echo "::error::build-run and ide-run are run ids (digits)"; exit 1; fi
              # The artifacts that can hold a web zip; gh fails only when
              # none of them is in the run
              gh run download "$run" --repo "$REPO" --dir "$RUNNER_TEMP/build-$run" \
                --pattern release-dry-run --pattern OXT-Beyond-linux-x86_64 --pattern OXT-Beyond-web-ide
            done
            for kind in web-player web-ide; do
              found=$(find "$RUNNER_TEMP"/build-* -name "OXT-Beyond-*-$kind.zip" | sort | head -n 1)
              if [ -z "$found" ]; then
                echo "::error::run $BUILD_RUN${IDE_RUN:+ (and $IDE_RUN)} has no OXT-Beyond-<version>-$kind.zip"
                exit 1
              fi
              cp "$found" "$RUNNER_TEMP/dist/"
            done
            echo "TAG=run $BUILD_RUN (not released)" >> "$GITHUB_ENV"
            echo "UNRELEASED=1" >> "$GITHUB_ENV"
            ls -l "$RUNNER_TEMP/dist"
            exit 0
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$REPO" --exclude-drafts --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          if [ -z "$TAG" ]; then echo "::error::no release to put on the site"; exit 1; fi
          echo "Release: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # One pattern at a time: gh refuses the whole download when a
          # pattern matches nothing, and an older release has no web IDE zip
          for pattern in '*-web-player.zip' '*-web-ide.zip'; do
            gh release download "$TAG" --repo "$REPO" --pattern "$pattern" --dir "$RUNNER_TEMP/dist" ||
              echo "$TAG has no $pattern"
          done
          ls -l "$RUNNER_TEMP/dist"

      - name: Fall back to main's web IDE
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ inputs.ide-run }}
        run: |
          if compgen -G "$RUNNER_TEMP/dist/*-web-ide.zip" > /dev/null; then
            echo "The release has its web IDE zip"
            exit 0
          fi
          run=$RUN
          if [ -n "$run" ] && ! [[ "$run" =~ ^[0-9]+$ ]]; then echo "::error::ide-run is a run id (digits)"; exit 1; fi
          if [ -z "$run" ]; then
            run=$(gh run list --repo "$REPO" --workflow web-ide.yml --branch main --event push --status success \
                    --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -n "$run" ] &&
             gh run download "$run" --repo "$REPO" --name OXT-Beyond-web-ide --dir "$RUNNER_TEMP/ide-artifact"; then
            (cd "$RUNNER_TEMP/ide-artifact" && sha256sum -c SHA256SUMS)
            cp "$RUNNER_TEMP"/ide-artifact/*-web-ide.zip "$RUNNER_TEMP/dist/"
            echo "IDE_FROM=Web IDE run $run" >> "$GITHUB_ENV"
          elif [ -n "$RUN" ]; then
            # Asked for by hand: a run without the artifact is a mistake, and
            # deploying would take the web IDE off the site
            echo "::error::Web IDE run $RUN has no artifact OXT-Beyond-web-ide (expired, or another workflow's run)"
            exit 1
          else
            echo "::warning::no web IDE zip in $TAG or in main's Web IDE runs; the site has the Stack Player alone"
          fi

      - name: Build the codebase map
        id: map
        # The site goes up without the map rather than not at all
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # d3 7.9.0's dist/d3.min.js (npm pack d3@7.9.0)
          D3_SHA256: f2094bbf6141b359722c4fe454eb6c4b0f0e42cc10cc7af921fc158fceb86539
        run: |
          work="$RUNNER_TEMP/codebase-map"
          mkdir -p "$work/engine"
          python3 -c 'import yaml' 2>/dev/null ||
            python3 -m pip install --user --break-system-packages pyyaml
          (cd "$work" && npm pack d3@7.9.0 --silent && tar -xzf d3-7.9.0.tgz)
          echo "$D3_SHA256  $work/package/dist/d3.min.js" | sha256sum -c
          git clone --quiet --depth 1 "https://github.com/$OWNER/xtalk-suite.git" "$work/suite"
          # The engine only reads the stacks, so any recent one does: the
          # newest release's, also when this run puts a test build up
          etag=$(gh release list --repo "$REPO" --exclude-drafts --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          dumps=()
          if gh release download "$etag" --repo "$REPO" --pattern '*-linux-x86_64-binaries.tar.xz' --dir "$work/engine"; then
            tar -xJf "$work"/engine/*-linux-x86_64-binaries.tar.xz -C "$work/engine"
            engine=$(find "$work/engine" -type f -name LiveCode-Community | head -n 1)
            bash tools/codebase-map/make_dumps.sh . "$engine" "$work/dumps"
            dumps=(--dumps "$work/dumps" --engine-label "$etag")
            echo "MAP_ENGINE=$etag" >> "$GITHUB_ENV"
          else
            echo "::warning::$etag has no Linux binaries; the map leaves out the binary stacks' scripts"
          fi
          python3 tools/codebase-map/build_map.py --beyond . --suite "$work/suite" "${dumps[@]}" \
            --d3 "$work/package/dist/d3.min.js" --out "$work/out"
          echo "MAP_HTML=$work/out/index.html" >> "$GITHUB_ENV"
          echo "MAP_VERSION=$GITHUB_REF_NAME @ $(git rev-parse --short=8 HEAD), $(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: List the release's downloads
        # The page goes up without the Downloads section rather than not
        # at all
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag=$TAG
          if [ -n "${UNRELEASED:-}" ] || ! [[ "$tag" =~ ^v[0-9] ]]; then
            tag=$(gh release list --repo "$REPO" --exclude-drafts --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          if [ -n "$tag" ] &&
             gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt" &&
             [ -s "$RUNNER_TEMP/release-assets.txt" ]; then
            echo "DOWNLOADS_TAG=$tag" >> "$GITHUB_ENV"
            wc -l < "$RUNNER_TEMP/release-assets.txt"
          else
            echo "::warning::could not list the files of ${tag:-the newest release}; the front page has no Downloads section"
          fi

      - name: Build the site
        run: |
          args=()
          ide=$(compgen -G "$RUNNER_TEMP/dist/*-web-ide.zip" | head -n 1 || true)
          player=$(compgen -G "$RUNNER_TEMP/dist/*-web-player.zip" | head -n 1 || true)
          if [ -n "$ide" ]; then
            version=$(basename "$ide" -web-ide.zip); version=${version#OXT-Beyond-}
            [ -n "${IDE_FROM:-}" ] && version="$version (with newer IDE scripts)"
            [ -n "${UNRELEASED:-}" ] && version="$version (test build)"
            args+=(--ide "$ide" --ide-version "$version")
          fi
          if [ -n "$player" ]; then
            version=$(basename "$player" -web-player.zip); version=${version#OXT-Beyond-}
            [ -n "${UNRELEASED:-}" ] && version="$version (test build)"
            args+=(--player "$player" --player-version "$version")
          fi
          if [ -n "${MAP_HTML:-}" ] && [ -f "$MAP_HTML" ]; then
            args+=(--map "$MAP_HTML" --map-version "$MAP_VERSION")
          fi
          if [ -n "${DOWNLOADS_TAG:-}" ]; then
            args+=(--release "$DOWNLOADS_TAG" --release-assets "$RUNNER_TEMP/release-assets.txt")
          fi
          python3 tools/pages/build_pages.py --out "$RUNNER_TEMP/site" "${args[@]}"
          describe() { if [ -n "$1" ]; then basename "$1"; else echo "not on the site"; fi; }
          {
            echo "Release: $TAG"
            echo
            echo "- Web IDE: $(describe "$ide")${ide:+${IDE_FROM:+, from $IDE_FROM}}"
            if [ -f "$RUNNER_TEMP/site/dictionary/index.html" ]; then
              echo "- Dictionary: from the web IDE's (what Help > Dictionary Online opens)"
            else
              echo "- Dictionary: not on the site (no web IDE, or one without the dictionary's files)"
            fi
            echo "- Stack Player: $(describe "$player")"
            if grep -q 'id="downloads"' "$RUNNER_TEMP/site/index.html"; then
              echo "- Downloads: the files of $DOWNLOADS_TAG"
            else
              echo "- Downloads: not on the front page"
            fi
            if [ -n "${MAP_HTML:-}" ]; then
              echo "- Codebase map: $MAP_VERSION${MAP_ENGINE:+, binary stacks read with the engine of $MAP_ENGINE}"
            else
              echo "- Codebase map: not on the site (its step failed; see the log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
