# Tags main for a release and starts the release, for whoever cannot push a
# tag (Actions > Tag a release > Run workflow, on main). It does what step 5
# of "Making a release" in BUILDING.md does by hand:
#
#   - reads ide/.version and makes the tag v<version> (annotated,
#     "OXT-Beyond <version>") on the commit main points at, after checking
#     that the tag does not exist yet (tags are never moved) and that the
#     three build workflows passed on that commit on main (its push, or a
#     run by hand on main, which this starts when the push built nothing);
#   - starts release.yml on the new tag without "dry-run", which publishes
#     the release as a pushed tag would. (A tag pushed with this run's token
#     starts no workflow by itself, so it is started here; there is never a
#     second run from the tag push.)
#
# Permissions: contents: write for the tag, actions: write to start the
# release, in this job only.

name: Tag a release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Tag main and start the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          # The runtimes check below walks the history back to the commit
          # the runtimes asset was built from
          fetch-depth: 0

      - name: Check the version, the tag and the builds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          version=$(tr -d '\r' < ide/.version)
          version="${version#"${version%%[![:space:]]*}"}"
          version="${version%"${version##*[![:space:]]}"}"
          [[ $version =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] ||
            fail "ide/.version contains '$version'; expected a version such as 0.1.0 or 0.1.0-rc.1"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            fail "The tag $tag exists already; tags are never moved. Set ide/.version to a new version first."
          fi
          # Every release carries the other platforms' runtimes of its own
          # engine (seth's decision MOD-D1, 2026-10-31): the runtimes asset
          # must have been rebuilt since the last commit that changed the
          # engine's source, and pinned (BUILDING.md section 10, step 1)
          python3 tools/ci/runtimes_provenance.py --fail-on-stale ||
            fail "The runtimes asset in tools/oxt/external-assets.json is older than the engine's source (the list is above and in the summary). Run the \"Runtimes asset\" workflow on main's latest green builds with publish, pin its entry in a pull request, merge it and run this again (BUILDING.md section 10, step 1)."
          # The newest run of each build on main for this commit: its push,
          # or a run by hand on main (a push that changed nothing the build
          # uses, such as documentation alone, starts no build, so one is
          # started here, and this workflow is run again once it passed)
          started=()
          for wf in build-windows.yml build-linux.yml build-macos.yml; do
            conclusion=$(gh api "repos/$GH_REPO/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&branch=main&per_page=30" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0] | if . == null then "not run" else (.conclusion // .status) end')
            if [ "$conclusion" = "not run" ]; then
              gh workflow run "$wf" --ref main
              started+=("$wf")
              continue
            fi
            [ "$conclusion" = success ] ||
              fail "$wf on main for $GITHUB_SHA: $conclusion. Tag only a commit whose builds passed (run this again once they have)."
          done
          if [ "${#started[@]}" -gt 0 ]; then
            fail "Nothing built $GITHUB_SHA on main yet (no change the builds use), so this started ${started[*]} on main; run this again once they have passed."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Make and push the tag
        env:
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "OXT-Beyond $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG" -f dry-run=false
          echo "Tagged \`$GITHUB_SHA\` as \`$TAG\` and started the Release workflow on it." >> "$GITHUB_STEP_SUMMARY"
