# The IDE's Android standalone builder, with a real Android SDK, on Windows,
# Linux and macOS (tools/ci/android_check.py; the Android plan's phase 0).
# The builder is IDE script only, so this needs no build: it takes a
# published release (the latest, or the tag given), and runs the release's
# own IDE twice, as it is and with this checkout's builder put in its place
# (android_check.py overlay):
#
#   - the units of the builder's handlers, which need no SDK;
#   - five builds of a probe stack through the builder, as File > Save as
#     Standalone Application makes them (debug-signed, signed with a key,
#     unsigned, a stack that never opened the Android card, and one signed
#     with a key that also asks for an Android App Bundle), by both
#     builders from the same stack file (the released one makes no App
#     Bundle);
#   - verify: what Android and Google Play ask of a package (signature
#     schemes, zipalign, resources.arsc, android:exported, 16 KB pages),
#     and of the App Bundle (the package's files, the native libraries
#     kept compressed and the assets stored in the device's packages, the
#     package's signer, bundletool's reading of it);
#   - compare: the two builders' packages hold the same files with the
#     same bytes, apart from what the change meant (the signatures, the push
#     receiver's android:exported), every difference printed: the "no
#     breaking changes" check of CLAUDE.md;
#   - Linux only, on emulators (KVM): the IDE's Test for an Android 13
#     (API 33) emulator, the packages installed and started there until the
#     probe's screen shows that its script ran, and then the same on the
#     first emulator image with 16 KB memory pages at API 36 (Android 16)
#     or newer, the stack inside the system bars on both; the App Bundle
#     installed as Google Play installs it (the device's split APKs, made
#     by bundletool from it), on the Android 13 emulator;
#   - Linux only, the Java layer built from this checkout
#     (tools/ci/android_java.py build; android-java.yml checks it without a
#     device) in a third copy of the release, with this builder: the Java
#     layer's probe (android_check.py ide --probe java), which schedules a
#     local notification before it turns green, built and run on both
#     emulators; the builder makes it target API 36, as it does with a
#     runtime whose Java layer is ready for that, so on Android 16 the back
#     key reaches its backKey through the back callback, and the stack is
#     kept inside the bars Android 15 and newer draw it under; its App
#     Bundle too, as split APKs, where the probe also reads the file it
#     carries from the base APK's stored assets. For the
#     record, the same probe with the release's own
#     Java layer, whose notification call throws on Android 12 and newer
#     (the engine clears the exception, so the call answers no id and the
#     probe turns its fail colour).
#   - Linux only, the engine's one start in a process (RelaunchActivity in
#     the Java layer says why): the app probe, built with this Java layer,
#     on both emulators, goes on in its process through a font size
#     change, starts again in a new process for a density change, and
#     opened again after its stack quits starts in a new one; the
#     packages with the release's Java layer go on through a font size
#     change (the manifest lists it), and, for the record, what that
#     layer does across a density change and opened again.
#
# The released builder's builds are the comparison's other half; where
# they fail (its shell zip is not there on Windows), the job says so and
# carries on without the comparison.
name: Android builder

on:
  pull_request:
    branches: [ main ]
    paths: &android-paths
      - .github/workflows/android.yml
      - tools/ci/android_check.py
      - tools/ci/android-check.livecodescript
      - ide-support/revsaveasandroidstandalone.livecodescript
      - ide-support/revdeploylibraryandroid.livecodescript
      - 'ide/Toolset/palettes/standalone settings/revstandalonesettingsandroidbehavior.livecodescript'
      - tools/ci/android_java.py
      - engine/engine-sources.gypi
      - 'engine/src/java/**'
  push:
    branches: [ main ]
    paths: *android-paths
  workflow_dispatch:
    inputs:
      tag:
        description: The release whose IDE to run (for example v0.2.7-rc.6.14); empty for the latest one
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  builder:
    name: Android builder on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            asset: linux-x86_64.tar.xz
          - platform: win-x86_64
            runner: windows-2022
            asset: win-x86_64-portable.zip
          - platform: mac-universal
            runner: macos-15
            asset: mac-universal.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$REPO" --limit 30 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]' | head -n 1)
          fi
          echo "Release: $TAG"
          echo "### Android builder on $PLATFORM, in the IDE of $TAG" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/dist"
          gh release download "$TAG" --repo "$REPO" --pattern "*-$ASSET" --dir "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          echo "PACKAGE=$(pwd -W 2>/dev/null || pwd)/$(ls *-"$ASSET")" >> "$GITHUB_ENV"
          py=python3
          [ "$RUNNER_OS" = Windows ] && py=python
          echo "PY=$py" >> "$GITHUB_ENV"
          work="$RUNNER_TEMP/android"
          [ "$RUNNER_OS" = Windows ] && work=$(cygpath -m "$work")
          echo "WORK=$work" >> "$GITHUB_ENV"

      # The IDE's runtime libraries and Xvfb, as ui-tour.yml installs them
      - name: Install Xvfb and the runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          pkgs=(xvfb xauth fonts-dejavu-core)
          while read -r soname use deb rpm rest; do
            case $soname in ''|'#'*) continue ;; esac
            if apt-cache show --no-all-versions "${deb}t64" > /dev/null 2>&1; then
              deb="${deb}t64"
            fi
            case " ${pkgs[*]} " in *" $deb "*) ;; *) pkgs+=("$deb") ;; esac
          done < Installer/linux/libraries.txt
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${pkgs[@]}"

      # The JDK that the builder's javac and keytool come from (as
      # build-macos.yml chooses one), and the parts of the runner's Android
      # SDK that the builder needs: the platform of its target API (the
      # released builder takes no other), build-tools and platform-tools.
      # On Linux also the emulator, an Android 13 image and the first image
      # with 16 KB pages, whose name sdkmanager lists, and the platform the
      # Java layer is built against (API 36)
      - name: Set up the JDK and the Android SDK
        run: |
          for v in JAVA_HOME_17_X64 JAVA_HOME_17_arm64 JAVA_HOME_21_X64 JAVA_HOME_21_arm64; do
            if [ -n "${!v}" ] && [ -d "${!v}/bin" ]; then
              jdk="${!v}"
              break
            fi
          done
          [ -n "$jdk" ] || { echo "::error::no JDK 17 or 21 on the runner"; exit 1; }
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          [ -d "$sdk" ] || { echo "::error::no Android SDK on the runner (ANDROID_HOME)"; exit 1; }
          if [ "$RUNNER_OS" = Windows ]; then
            jdk=$(cygpath -m "$jdk")
            sdk=$(cygpath -m "$sdk")
          fi
          echo "JDK=$jdk" >> "$GITHUB_ENV"
          echo "SDK=$sdk" >> "$GITHUB_ENV"
          sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ "$RUNNER_OS" = Windows ] && sm="$sm.bat"
          (yes || true) | "$sm" --licenses > /dev/null
          parts=("platforms;android-33" "build-tools;35.0.0" "platform-tools")
          if [ "$RUNNER_OS" = Linux ]; then
            # the first image with 16 KB pages at API 36 or newer: Android
            # 16, which sends the back key of an app that targets API 36
            # only to its back callback (the Java layer's probe, --back)
            img16=$("$sm" --list 2>/dev/null | grep -oE 'system-images;android-[0-9.]+;google_apis_ps16k;x86_64' |
              awk -F';' '{ v = $2; sub(/^android-/, "", v); if (v + 0 >= 36) print }' |
              sort -u -t';' -k2,2V | head -n 1)
            [ -n "$img16" ] || { echo "::error::sdkmanager lists no x86_64 image with 16 KB pages at API 36 or newer"; exit 1; }
            echo "IMAGE_16K=$img16" >> "$GITHUB_ENV"
            parts+=("emulator" "system-images;android-33;google_apis;x86_64" "$img16" "platforms;android-36")
          fi
          "$sm" --install "${parts[@]}" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 ||
            { tail -40 "$RUNNER_TEMP/sdkmanager.log"; exit 1; }
          echo "JDK: $jdk"; "$jdk/bin/java" -version 2>&1 | head -n 1
          echo "SDK: $sdk"; ls "$sdk/platforms" "$sdk/build-tools"

      - name: Unpack the release twice, and put this builder into one
        run: |
          "$PY" tools/ci/android_check.py extract --package "$PACKAGE" --dest "$WORK/released-ide" \
            --platform "$PLATFORM" --env RELEASED
          "$PY" tools/ci/android_check.py extract --package "$PACKAGE" --dest "$WORK/changed-ide" \
            --platform "$PLATFORM" --env CHANGED
          "$PY" tools/ci/android_check.py overlay --root "$WORK/changed-ide"

      - name: Build the Java layer, and unpack the release a third time
        if: runner.os == 'Linux'
        run: |
          "$PY" tools/ci/android_java.py build --sdk "$SDK" --jdk "$JDK" --api 36 --out "$WORK/java/Classes"
          "$PY" tools/ci/android_check.py extract --package "$PACKAGE" --dest "$WORK/java-ide" \
            --platform "$PLATFORM" --env JAVA_IDE

      - name: Put this builder and the Java layer into the third
        if: runner.os == 'Linux'
        run: |
          "$PY" tools/ci/android_check.py overlay --root "$JAVA_IDE" --classes "$WORK/java/Classes"

      # Started now: it boots while the IDE builds
      - name: Start an Android 13 emulator
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # One place for the AVDs, for avdmanager and the emulator alike,
          # and for the 16 KB step's (GITHUB_ENV): left to themselves they
          # looked in different places, and the emulator exited at once
          # with "Unknown AVD name [api33]"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n api33 \
            -k "system-images;android-33;google_apis;x86_64" -d pixel_5 --force
          echo "The emulator's AVDs: $("$SDK/emulator/emulator" -list-avds | tr '\n' ' ')"
          # adb's server first: it makes ~/.android/adbkey, which the
          # emulator hands to the image as it starts
          "$SDK/platform-tools/adb" start-server
          nohup "$SDK/emulator/emulator" -avd api33 -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            > "$WORK/emulator-api33.log" 2>&1 &
          # An emulator that cannot start says why in its first seconds
          # (its log otherwise only reaches the artifact); the wait for it
          # says more if it never boots
          sleep 20
          df -h / | tail -n 1
          # A warning, not a failure, so that the builder's own steps still
          # run; the wait for the emulator fails within seconds then
          if ! pgrep -f 'qemu-system|emulator.*-avd api33' > /dev/null; then
            echo "::warning::the Android 13 emulator stopped within 20 s of starting; the end of its log:"
            tail -n 40 "$WORK/emulator-api33.log"
          fi

      - name: This builder (units and builds)
        run: |
          "$PY" tools/ci/android_check.py ide --install "$CHANGED" --platform "$PLATFORM" \
            --work "$WORK/changed" --sdk "$SDK" --jdk "$JDK"

      - name: Check the packages
        run: |
          "$PY" tools/ci/android_check.py verify --work "$WORK/changed" --sdk "$SDK" --jdk "$JDK"

      # The same stack file: it goes into the engine library
      - name: The released builder (builds)
        id: released
        continue-on-error: true
        run: |
          "$PY" tools/ci/android_check.py ide --install "$RELEASED" --platform "$PLATFORM" \
            --work "$WORK/released" --sdk "$SDK" --jdk "$JDK" --no-units \
            --stack "$WORK/changed/AndroidProbe.livecode"

      - name: The released builder made no packages to compare
        if: steps.released.outcome != 'success'
        run: |
          msg="the released builder could not build the probe on $PLATFORM, so there is no comparison here (see its step)"
          echo "::warning::$msg"
          echo "- $msg" >> "$GITHUB_STEP_SUMMARY"
          [ "$RUNNER_OS" != Linux ] || { echo "::error::on Linux it must"; exit 1; }

      - name: Compare with the released builder's packages
        if: steps.released.outcome == 'success'
        run: |
          "$PY" tools/ci/android_check.py compare --old "$WORK/released" --new "$WORK/changed" --sdk "$SDK"

      # The Java layer's probe, by this builder with the Java layer built
      # here: a debug build, as the IDE's Test makes, and an App Bundle, as
      # Google Play takes it. The Java layer is ready for API 36, so the
      # builder targets it (androidTargetAPI), and the manifest keeps the
      # stack's orientation on large screens
      - name: The Java layer's probe, with this Java layer
        if: runner.os == 'Linux'
        run: |
          "$PY" tools/ci/android_check.py ide --install "$JAVA_IDE" --platform "$PLATFORM" \
            --work "$WORK/java-new" --sdk "$SDK" --jdk "$JDK" --no-units --builds debug,bundle --probe java
          "$PY" tools/ci/android_check.py verify --work "$WORK/java-new" --sdk "$SDK" --jdk "$JDK" \
            --builds debug,bundle --target 36

      # The app probe, by this builder with the Java layer built here,
      # which has RelaunchActivity: the builder declares it, in a process
      # of its own, as for any stack built with this runtime (verify checks
      # the declaration against the package's dex, and the configuration
      # changes)
      - name: The app probe, with this Java layer
        if: runner.os == 'Linux'
        run: |
          "$PY" tools/ci/android_check.py ide --install "$JAVA_IDE" --platform "$PLATFORM" \
            --work "$WORK/java-app" --sdk "$SDK" --jdk "$JDK" --no-units --builds debug \
            --stack "$WORK/changed/AndroidProbe.livecode"
          "$PY" tools/ci/android_check.py verify --work "$WORK/java-app" --sdk "$SDK" --jdk "$JDK" \
            --builds debug --target 36

      # The same stack, by the same builder, with the release's own Java
      # layer: the "before" of the comparison
      - name: The Java layer's probe, with the release's Java layer
        if: runner.os == 'Linux'
        run: |
          "$PY" tools/ci/android_check.py ide --install "$CHANGED" --platform "$PLATFORM" \
            --work "$WORK/java-old" --sdk "$SDK" --jdk "$JDK" --no-units --builds debug --probe java \
            --stack "$WORK/java-new/AndroidJavaProbe.livecode"

      # boot gives up after 10 minutes, or within seconds once the
      # emulator has exited, with what may say why (the emulator's
      # processes, /dev/kvm, adb's devices, the disk, the end of its log),
      # before the step's own timeout cuts it off saying nothing.
      # --settle, as for the 16 KB image: a just-booted image enables
      # overlays in its first minutes, which recreates a running activity,
      # and the release's Java layer does not survive that (see "The
      # release's Java layer across a density change"). The image had booted while the
      # IDE built, and in run 42142328807 the release package's activity
      # was relaunched as it started (its screen stayed black) a minute
      # after the debug package's ran; so the probes start once it is done.
      # --awake first, as for the 16 KB image: one sleep, so that what
      # Android keeps until the screen is off is done before the probes,
      # then the screen woken, unlocked and kept on (it was MENU and
      # svc power stayon here)
      - name: Wait for the emulator
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          adb="$SDK/platform-tools/adb"
          "$PY" tools/ci/android_check.py boot --serial emulator-5554 --sdk "$SDK" \
            --log "$WORK/emulator-api33.log" --minutes 10 --awake --settle
          "$adb" devices

      # What Test does (deployDo): the builder makes a debug-signed package
      # for the emulator's architecture, adb installs and starts it
      - name: The IDE's Test on the emulator
        if: runner.os == 'Linux'
        run: |
          "$PY" tools/ci/android_check.py ide --install "$CHANGED" --platform "$PLATFORM" \
            --work "$WORK/test" --sdk "$SDK" --jdk "$JDK" --no-units --builds debug \
            --stack "$WORK/changed/AndroidProbe.livecode" --device emulator-5554

      # --within-bars: the stack is not drawn under the status and
      # navigation bars (an app that targets API 33 never is). The App
      # Bundle is installed as Google Play installs it: bundletool (the
      # one the builder downloaded) makes the device's split APKs of it.
      # --font-scale, once: the app goes on in its process through a font
      # size change, which the manifest now lists, with the release's own
      # Java layer too (made again in its process, it was stopped)
      - name: Run the packages on Android 13
        if: runner.os == 'Linux'
        run: |
          for pkg in debug.apk release.apk bundle.aab; do
            "$PY" tools/ci/android_check.py device --apk "$WORK/changed/out/$pkg" --serial emulator-5554 \
              --sdk "$SDK" --out "$WORK/screen-api33-${pkg%.*}.png" --log-out "$WORK/logcat-api33-${pkg%.*}.txt" \
              --within-bars --bundletool "$WORK/changed/bundletool.jar" --jdk "$JDK" \
              $([ "$pkg" = debug.apk ] && echo --font-scale)
          done

      # It declares POST_NOTIFICATIONS, so as it schedules its notification
      # the Java layer asks the user to allow it: --allow waits for
      # Android's dialog, taps Allow and checks that the package holds it.
      # It exports a picture: --picture finds it among the shared pictures
      # (MediaStore) as the package's own. --back: once green, the back key
      # must reach its backKey (Android 13 sends it to onBackPressed, as
      # before); --within-bars: it targets API 36, and Android 13 does not
      # draw it under the bars. Its App Bundle the same way, as split APKs
      # (the probe reads its copy file from the base APK's assets)
      - name: Run the Java layer's probe on Android 13
        if: runner.os == 'Linux'
        run: |
          for pkg in debug.apk bundle.aab; do
            "$PY" tools/ci/android_check.py device --apk "$WORK/java-new/out/$pkg" --serial emulator-5554 \
              --sdk "$SDK" --out "$WORK/screen-api33-java-${pkg%.*}.png" \
              --log-out "$WORK/logcat-api33-java-${pkg%.*}.txt" --bundletool "$WORK/java-new/bundletool.jar" \
              --jdk "$JDK" --allow android.permission.POST_NOTIFICATIONS --picture oxt-beyond-probe.png --back \
              --within-bars
          done

      # The engine runs once in a process. --font-scale: the app goes on in
      # its process through a font size change (the manifest lists it);
      # --density: for a change it cannot list, Android makes the activity
      # again in its process, and the app starts again in a new one
      # (RelaunchActivity) and shows its green there; --relaunch: the back
      # key, which the app probe passes, quits its stack, its process ends,
      # and the app opened again starts in a new one. Each was stopped on
      # Android 11 and newer (fdsan) as the engine started a second time in
      # the process
      - name: Run the app probe with this Java layer on Android 13
        if: runner.os == 'Linux'
        run: |
          "$PY" tools/ci/android_check.py device --apk "$WORK/java-app/out/debug.apk" --serial emulator-5554 \
            --sdk "$SDK" --out "$WORK/screen-api33-java-app.png" --log-out "$WORK/logcat-api33-java-app.txt" \
            --within-bars --font-scale --density --relaunch

      # For the record, not a check (no annotations, so the run's account
      # stays the checks'): the same probe with the release's own Java
      # layer, whose local notification throws on Android 12 and newer
      # (its PendingIntent says neither FLAG_IMMUTABLE nor FLAG_MUTABLE).
      # The app does not stop: the engine clears the exception, the call
      # answers no id, and the probe turns its fail colour (run
      # 42157367103). The probe takes its other steps too and says what
      # each answered, and the summary keeps what it said: whether Android
      # 13 refuses that layer WRITE_EXTERNAL_STORAGE, and so its external
      # folder and its export to the album
      - name: The Java layer's probe with the release's Java layer, on Android 13
        if: runner.os == 'Linux'
        run: |
          set +e
          out=$(env -u GITHUB_ACTIONS -u GITHUB_STEP_SUMMARY "$PY" tools/ci/android_check.py device \
            --apk "$WORK/java-old/out/debug.apk" --serial emulator-5554 --sdk "$SDK" \
            --out "$WORK/screen-api33-java-released.png" --log-out "$WORK/logcat-api33-java-released.txt" 2>&1)
          status=$?
          echo "$out"
          said=$(echo "$out" | grep -E '^PROBLEM: ' | head -n 3 | sed 's/^PROBLEM: //' | tr '\n' ' ')
          echo "- the Java layer's probe with the release's Java layer on Android 13: $([ $status = 0 ] && echo 'green' || echo "not green: $said")" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # For the record, not a check: what Android 13 says to the released
      # builder's packages (its "Sign with my key" one lost its v2 and v3
      # signatures to zipalign, its "Sign for development only" one is not
      # signed)
      - name: The released builder's packages on Android 13
        if: runner.os == 'Linux' && steps.released.outcome == 'success'
        run: |
          adb="$SDK/platform-tools/adb"
          for build in debug release; do
            "$adb" -s emulator-5554 uninstall org.openxtalk.check.androidprobe > /dev/null 2>&1 || true
            out=$({ "$adb" -s emulator-5554 install -r "$WORK/released/out/$build.apk" 2>&1 || true; } | tr '\r\n' '  ')
            echo "released $build.apk: $out"
            echo "- the released builder's $build.apk on Android 13: \`$out\`" >> "$GITHUB_STEP_SUMMARY"
          done
          "$adb" -s emulator-5554 uninstall org.openxtalk.check.androidprobe > /dev/null 2>&1 || true

      # For the record, not a check (no annotations): the release's own Java
      # layer, which has no RelaunchActivity, so the builder declares none,
      # across a density change, which no manifest can list, and opened
      # again after its stack quit (the back key). Android makes the
      # activity again in the process whose engine ran; that layer starts
      # the engine a second time, whose start opens fd 0 again
      # (MCAndroidSystem::Initialize, fdopen), and fdsan stops it on
      # Android 11 and newer for an app that targets API 30 or newer. The
      # summary keeps what each said
      - name: The release's Java layer across a density change and opened again, on Android 13
        if: runner.os == 'Linux'
        run: |
          set +e
          for check in density relaunch; do
            out=$(env -u GITHUB_ACTIONS -u GITHUB_STEP_SUMMARY "$PY" tools/ci/android_check.py device \
              --apk "$WORK/changed/out/debug.apk" --serial emulator-5554 --sdk "$SDK" \
              --out "$WORK/screen-api33-released-java-$check.png" \
              --log-out "$WORK/logcat-api33-released-java-$check.txt" "--$check" 2>&1)
            status=$?
            echo "$out"
            said=$(echo "$out" | grep -E '^PROBLEM: ' | head -n 3 | sed 's/^PROBLEM: //' | tr '\n' ' ')
            echo "- the release's Java layer on Android 13, --$check: $([ $status = 0 ] && echo 'passed' || echo "failed: $said")" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - name: Run the package with 16 KB pages
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          adb="$SDK/platform-tools/adb"
          "$adb" -s emulator-5554 emu kill || true
          for i in $(seq 1 60); do "$adb" devices | grep -q emulator-5554 || break; sleep 2; done
          echo "Image: $IMAGE_16K"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n pages16k -k "$IMAGE_16K" \
            -d pixel_5 --force
          echo "The emulator's AVDs (in $ANDROID_AVD_HOME): $("$SDK/emulator/emulator" -list-avds | tr '\n' ' ')"
          # 3 GB of memory, not the 1536 MB avdmanager gives a Pixel 5: in
          # run 42312203693 Android 16 ran short with 1536 MB (the low
          # memory killer's "min watermark is breached") and killed the Java
          # layer's probe (exit-info LOW_MEMORY) while its notification
          # permission dialog was in front, so the probe never came back.
          # (Run 42324548829 did the same with 3 GB: the probe had started
          # while the system's apps were still taking its install, so
          # device now waits for that first.)
          sed -i '/^hw.ramSize=/d' "$ANDROID_AVD_HOME/pages16k.avd/config.ini"
          echo 'hw.ramSize=3072M' >> "$ANDROID_AVD_HOME/pages16k.avd/config.ini"
          # its memory and cores, for the account device prints if the probe dies
          grep -h -e '^hw.ramSize' -e '^hw.cpu.ncore' "$ANDROID_AVD_HOME/pages16k.avd/config.ini" || true
          nohup "$SDK/emulator/emulator" -avd pages16k -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            > "$WORK/emulator-16k.log" 2>&1 &
          # --settle: a just-booted image enables overlays in its first
          # minute, which recreates a running activity, and the release's
          # Java layer aborts on a second start in one process (see "The
          # release's Java layer across a density change"); this step is
          # for 16 KB loading, so the probe starts once the image is done.
          # --awake: in run 42218720113 the screen went off a minute after
          # boot, as the Java layer's probe started; SystemUI then added
          # its theme overlays (it keeps them until the screen is off), and
          # the probe, relaunched, aborted after its green. So the image
          # sleeps once before settling, and then stays awake and unlocked
          "$PY" tools/ci/android_check.py boot --serial emulator-5554 --sdk "$SDK" \
            --log "$WORK/emulator-16k.log" --minutes 12 --awake --settle
          page=$("$adb" shell getconf PAGE_SIZE | tr -d '\r')
          echo "Page size: $page"
          [ "$page" = 16384 ] || { echo "::error::$IMAGE_16K has pages of $page bytes, not 16384"; exit 1; }
          # the package that targets API 33 inside the bars, as on older
          # Android; the Java layer's probe, which targets API 36, too:
          # Android 16 draws it edge to edge and the Java layer pads it,
          # and sends its back key only to the back callback; and its App
          # Bundle, as split APKs. The app probe with this Java layer as on
          # Android 13: once in a process, through a font size change, a
          # density change, and opened again after its stack quits
          "$PY" tools/ci/android_check.py device --apk "$WORK/changed/out/debug.apk" --serial emulator-5554 \
            --sdk "$SDK" --out "$WORK/screen-16k-debug.png" --log-out "$WORK/logcat-16k-debug.txt" --within-bars
          "$PY" tools/ci/android_check.py device --apk "$WORK/java-app/out/debug.apk" --serial emulator-5554 \
            --sdk "$SDK" --out "$WORK/screen-16k-java-app.png" --log-out "$WORK/logcat-16k-java-app.txt" \
            --within-bars --font-scale --density --relaunch
          for pkg in debug.apk bundle.aab; do
            "$PY" tools/ci/android_check.py device --apk "$WORK/java-new/out/$pkg" --serial emulator-5554 \
              --sdk "$SDK" --out "$WORK/screen-16k-java-${pkg%.*}.png" --log-out "$WORK/logcat-16k-java-${pkg%.*}.txt" \
              --bundletool "$WORK/java-new/bundletool.jar" --jdk "$JDK" \
              --allow android.permission.POST_NOTIFICATIONS --picture oxt-beyond-probe.png --back --within-bars
          done

      - name: Upload the packages and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-builder-${{ matrix.platform }}
          path: |
            ${{ env.WORK }}/*/android-check.txt
            ${{ env.WORK }}/*/ide-output.txt
            ${{ env.WORK }}/*/out/*.apk
            ${{ env.WORK }}/*/out/*.aab
            ${{ env.WORK }}/*.png
            ${{ env.WORK }}/*.log
            ${{ env.WORK }}/logcat-*.txt
          if-no-files-found: warn
          retention-days: 14
