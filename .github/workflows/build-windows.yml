# Builds OXT-Beyond for Windows x86-64 (Release) on a GitHub-hosted
# windows-2022 runner, checks the result and packages it:
#
#   OXT-Beyond-<ver>-win-x86_64-setup.exe     installer (Inno Setup)
#   OXT-Beyond-<ver>-win-x86_64-portable.zip  the installed program folder,
#                                             under one top folder
#                                             OXT-Beyond-<ver>
#   OXT-Beyond-<ver>-win-x86_64-binaries.zip  win-x86_64-bin without *.pdb,
#                                             plus the licence files
#   OXT-Beyond-<ver>-win-x86_64-symbols.zip   the *.pdb files
#   OXT-Beyond-<ver>-xtalk-sources.zip        (release and main) every file
#                                             the xTalk Suite extensions
#                                             pin, so that the release can
#                                             be rebuilt without the member
#                                             repositories; the release
#                                             takes it from here only, for
#                                             all platforms
#   SHA256SUMS
#
# <ver> is the product version in ide/.version. The build number written into
# the packaged .buildnumber (OXT_BUILD_NUMBER) is the input build-number when
# release.yml gives one (the same for every platform of a release), else the
# UTC time of the commit, as YYYYMMDDHHMM: the same for every job and
# platform that builds the commit, so that release.yml can publish the
# packages of main's builds without building them again.
#
# After the build and its verification, the job
#   1. writes the installed layout to dist/stage/OXT-Beyond-<ver> and the zips
#      to dist (tools/ci/package-windows.ps1, which runs tools/oxt/package.py,
#      with the documentation data that the job Docs generated before the
#      build, .github/workflows/docs.yml, and the web runtime that the job
#      Web built, .github/workflows/web.yml, which the IDE builds HTML5
#      standalones from;
#      the archives of the external assets listed in
#      tools/oxt/external-assets.json are cached from
#      prebuilt/fetched-assets/*.zip, the files of the xTalk Suite
#      extensions pinned in tools/oxt/xtalk-extensions.json from
#      prebuilt/fetched-assets/xtalk; see the Package step for leaving
#      them out), and checks that every Windows DLL of the bundled
#      extensions finds its imports (check-extension-imports.ps1),
#   2. runs the headless smoke test on the portable zip (smoke-test.ps1),
#      which also loads every bundled xTalk extension and calls it,
#   3. compiles every IDE script in dist/stage and compares the errors with
#      tools/ci/ide-compile-baseline.txt (ide-compile-check.ps1),
#   4. builds the installer (build-installer.ps1), and
#   5. installs it per user, smoke-tests the installed program and
#      uninstalls it (test-installer.ps1), and
#   6. builds a web standalone with the staged IDE's web builder and opens
#      it in headless Chromium (tools/ci/web_check.py --install).
# Before the build, it checks the IDE's stack patches with
# tools/ci/check_ide_stacks.py, which needs no build, and builds the prebuilt
# third-party libraries from source (OpenSSL, curl, ICU and those of
# thirdparty/, prebuilt/build-libraries-windows.ps1, which also repackages
# Spotify's CEF build) unless its cache has them.
# A run that passes all of these uploads the files in dist (not dist/stage)
# as the workflow artifact "OXT-Beyond-win-x86_64", and the installer again
# alone, not zipped, as the artifact named after it. Every run, including a
# failed one, uploads the logs as "build-logs-win-x86_64".
#
# Releases: .github/workflows/release.yml calls this workflow (workflow_call)
# for a tag that starts with "v" and for its dry runs, together with the
# Linux and macOS workflows, and publishes this artifact with theirs; this
# workflow publishes nothing itself and no longer runs on tags of its own,
# so that a tag builds every platform once. In a called run the github
# context is the caller's: a tag build of a "v" tag fails straight away
# unless the tag is "v" followed by ide/.version (for example v0.1.0), and
# the input release makes the run build as for a release (the external
# assets and the xTalk Suite extensions always included, and the xTalk
# sources zip written) also for a dry run on a branch.
#
# The toolchain matches BUILDING.md: Visual Studio 2022 with the MSVC v141
# toolset added at run time, Windows SDK 10.0.17763.0, Python 2.7 in
# C:\Python27, Strawberry Perl (preinstalled on the image) and Cygwin in
# C:\cygwin64 (kept off PATH). The scripts it calls are in tools/ci.
#
# windows-2022 is pinned on purpose: windows-latest and windows-2025 now
# provide Visual Studio 2026 with only the 10.0.26100 SDK.

name: Build (Windows)

on:
  # No tags here: release.yml builds them (see the header)
  push:
    branches: [main]
    paths-ignore: &build-paths-ignore
      # Nothing that goes into this platform's build, packages or checks:
      # the Markdown files at the top of the repository, the changelog
      # fragments (changelog), GitHub's issue and pull request forms,
      # the workflows and scripts that build nothing (screenshots branch, Pages,
      # release, runtimes, tagging, checks by hand, the CI checks), and
      # what only the other platforms' builds use. A file that is not
      # listed builds; tools/ci/tests checks that no file a build workflow
      # names is listed in its own list.
      - '*.md'
      - 'changelog/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/ci-checks.yml'
      - '.github/workflows/plugin-packages.yml'
      - '.github/workflows/field-speed.yml'
      - '.github/workflows/ide-screenshots.yml'
      - '.github/workflows/media-check.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/runtimes.yml'
      - '.github/workflows/tag-release.yml'
      - '.github/workflows/ui-tour.yml'
      - '.github/workflows/pages.yml'
      - 'tools/pages/**'
      - 'tools/ci/changelog.py'
      - 'tools/ci/ide_screenshots_branch.py'
      - 'tools/ci/release_assets.py'
      - 'tools/ci/release_notes.py'
      - 'tools/ci/tests/**'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/build-macos.yml'
      - 'tools/ci/browser-wm-check.livecodescript'
      - 'tools/ci/browser_wm_check.py'
      - 'tools/ci/check_elf_floor.py'
      - 'tools/ci/check_linux_libraries.py'
      - 'tools/ci/check_macho_floor.py'
      - 'tools/ci/engine-tests-baseline-linux*.txt'
      - 'tools/ci/engine-tests-baseline-mac.txt'
      - 'tools/ci/i386-container.sh'
      - 'tools/ci/ide-compile-baseline-linux.txt'
      - 'tools/ci/linux_ide_start.sh'
      - 'tools/ci/list_build_tools.py'
      - 'tools/ci/mac_ide_start.sh'
      - 'tools/ci/merge_universal.py'
      - 'tools/ci/sign_mac_app.py'
      - 'tools/ci/test_linux_package.py'
      - 'tools/ci/web-tests-baseline.txt'
      - 'tools/ci/web-tests.livecodescript'
      - 'tools/ci/web_tests.py'
  pull_request:
    branches: [main]
    paths-ignore: *build-paths-ignore
  workflow_dispatch:
    inputs:
      no_external_assets:
        description: >-
          Package without the external assets of tools/oxt/external-assets.json
          (no runtimes for other platforms), for testing while an asset is not
          published yet
        type: boolean
        default: false
      no_xtalk_extensions:
        description: >-
          Package without the xTalk Suite extensions of
          tools/oxt/xtalk-extensions.json
        type: boolean
        default: false
  workflow_call:
    inputs:
      build-number:
        description: >-
          OXT_BUILD_NUMBER for every file of the run (digits; release.yml
          gives all three platforms the same); empty for the UTC time at
          which the build starts
        type: string
        required: false
        default: ''
      release:
        description: >-
          Build as for a release: never leave out the external assets or the
          xTalk Suite extensions, and write the xTalk sources zip
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # A literal name, not github.workflow: in a run that release.yml calls,
  # github.workflow is the caller's name, which the three called builds
  # (and release.yml itself) would share, so that they would cancel each
  # other or wait for their caller for good. A called release build gets a
  # group of its own (the caller's run id), so that pushes to the same
  # branch neither cancel it nor wait for it.
  group: build-windows-${{ inputs.release && format('release-{0}', github.run_id) || github.ref }}
  # Newer pushes to a branch or pull request replace older runs; tag builds
  # always run to completion.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The documentation data of the packages (docs.yml), which the build job
  # packages: it takes a few minutes, before the build starts
  docs:
    name: Docs
    uses: ./.github/workflows/docs.yml
    with:
      artifact: OXT-Beyond-docs-windows

  # The web runtime (web.yml), which the build job packages: from its
  # cache when the engine's sources did not change, otherwise built before
  # the build starts
  web:
    name: Web
    uses: ./.github/workflows/web.yml
    with:
      artifact: OXT-Beyond-web-windows

  build:
    name: Build win-x86_64
    needs: [docs, web]
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      # Read by make.cmd
      BUILDTYPE: Release
      BUILD_PLATFORM: win-x86_64
      # Keep the v141 compiler on an SDK from the same supported toolchain era.
      # SDK 10.0.22621 fails while parsing winnt.h in kernel-installer; the
      # generated GYP projects originally targeted 10.0.14393.0.
      WINSDK_VERSION: 10.0.17763.0
      WINSDK_COMPONENT: Microsoft.VisualStudio.Component.Windows10SDK.17763
      # Read by util/invoke-unix.bat, which runs the Cygwin bash, flex and bison
      CYGPATH: C:\cygwin64
      # Read by prebuilt/fetch-libraries.sh: only the Release libraries are
      # needed, and a tarball it had to download would have to match
      # prebuilt/SHA256SUMS; the ones built here come from PREBUILT_LOCAL_DIR
      PREBUILT_WIN32_SUBPLATFORMS: v141_static_release
      PREBUILT_STRICT: '1'
    outputs:
      version: ${{ steps.product.outputs.version }}

    steps:
      # A failed Docs job fails this job, which pull requests need: had
      # this job been skipped instead, its check would pass
      - name: Check the documentation job
        if: ${{ needs.docs.result != 'success' }}
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          Write-Output "::error::The job Docs did not succeed ($env:DOCS_RESULT): there is no documentation to package"
          exit 1

      # Likewise the job Web
      - name: Check the web runtime job
        if: ${{ needs.web.result != 'success' }}
        env:
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          Write-Output "::error::The job Web did not succeed ($env:WEB_RESULT): there is no web runtime to package"
          exit 1

      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      # Fails a tag build straight away when the tag does not match
      # ide/.version, instead of after the build; release.yml checks it
      # before any build starts, and again before publishing. (In a run
      # that release.yml calls, github.ref_type and github.ref_name are the
      # caller's: the tag it was started for.)
      - name: Read the product version
        id: product
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_NUMBER_INPUT: ${{ inputs.build-number }}
        run: |
          $version = (Get-Content -LiteralPath ide/.version -Raw).Trim()
          if ($version -notmatch '^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "ide/.version contains '$version'; expected a version such as 0.0.1 or 0.1.0-beta.1"
          }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -like 'v*' -and $env:REF_NAME -cne "v$version") {
            throw "Tag $env:REF_NAME does not match ide/.version ($version); the tag for this version is v$version"
          }
          # One build number for every file of this run: release.yml's, else
          # the UTC time of the commit (YYYYMMDDHHMM), which every platform's
          # build of the commit shares, so that release.yml can publish the
          # packages of main's builds as they are. Digits only, as
          # tools/oxt/package.py and package-windows.ps1 require.
          if ($env:BUILD_NUMBER_INPUT) {
            if ($env:BUILD_NUMBER_INPUT -notmatch '^[0-9]{1,20}$') {
              throw "The input build-number is '$env:BUILD_NUMBER_INPUT'; expected digits, such as 202610011200"
            }
            $buildNumber = $env:BUILD_NUMBER_INPUT
          }
          else {
            $commitTime = git log -1 --format=%ct HEAD
            if ($LASTEXITCODE -ne 0 -or "$commitTime" -notmatch '^[0-9]+$') { throw "Could not read the commit time of HEAD: '$commitTime'" }
            $buildNumber = [DateTimeOffset]::FromUnixTimeSeconds([long]$commitTime).UtcDateTime.ToString('yyyyMMddHHmm')
          }
          Write-Host "OXT-Beyond $version, build number $buildNumber"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version`nbuild-number=$buildNumber" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "OXT_BUILD_NUMBER=$buildNumber" -Encoding utf8

      - name: Show runner environment
        continue-on-error: true
        run: |
          Write-Host "OS: $([Environment]::OSVersion.VersionString)"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used } |
            Format-Table Name, Root,
              @{ n = 'Used (GB)'; e = { [math]::Round($_.Used / 1GB, 1) } },
              @{ n = 'Free (GB)'; e = { [math]::Round($_.Free / 1GB, 1) } } -AutoSize |
            Out-String | Write-Host
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -products * -format text -nologo |
            Select-String '^(displayName|installationPath|installationVersion):' |
            ForEach-Object { Write-Host $_.Line }
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "Windows SDK: $($_.Name)" }
          foreach ($tool in 'git', 'perl', 'python', 'bash', 'cygpath', 'choco') {
            foreach ($c in @(Get-Command $tool -All -CommandType Application -ErrorAction SilentlyContinue)) {
              Write-Host ('{0,-8} {1}' -f $tool, $c.Source)
            }
          }
          git --version
          perl -v | Select-Object -Skip 1 -First 1
          python --version

      # Checks of the IDE sources that need no build, so that they fail
      # before the long build does. The image's Python 3 is the python on
      # PATH (Python 2.7 for the build is installed later, in C:\Python27,
      # off PATH).
      #   check_ide_stacks.py           the script patches of
      #                                 tools/oxt/ide-stack-patches are
      #                                 applied to the binary IDE stacks
      #                                 (the Linux build checks the property
      #                                 patches with an engine)
      - name: Lint IDE sources
        id: ide_lint
        run: |
          python -c "import sys; sys.exit(0 if sys.version_info >= (3, 8) else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'python on PATH is not Python 3.8 or later' }
          $failed = @()
          foreach ($check in @('check_ide_stacks.py')) {
            Write-Host "::group::$check"
            python "tools/ci/$check"
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) { $failed += $check }
          }
          if ($failed.Count -gt 0) { throw "Failed: $($failed -join ', ')" }

      # The v141 toolset: about five minutes of the Visual Studio installer,
      # cached instead (tools/ci/vs-toolset-cache.ps1). The win-x86 job of
      # main's builds saves the files the installer added; every job
      # restores them before the step below, which then finds the toolset
      # complete and skips the installer. The key holds the runner image's
      # name and version (environment variables of the runner, which the
      # env context does not have), so a new image, with a new Visual
      # Studio, starts afresh.
      - name: Compute the Visual Studio toolset cache key
        id: vs-key
        env:
          SCRIPTS_HASH: ${{ hashFiles('tools/ci/install-vs-components.ps1', 'tools/ci/vs-toolset-cache.ps1') }}
        run: |
          if (-not $env:ImageOS -or -not $env:ImageVersion) {
            Write-Host '::warning::ImageOS or ImageVersion is not set: the Visual Studio toolset is not cached'
            exit 0
          }
          "key=vs-v141-$env:ImageOS-$env:ImageVersion-$env:WINSDK_VERSION-$($env:SCRIPTS_HASH.Substring(0, 16))-v1" |
            Add-Content $env:GITHUB_OUTPUT

      - name: Restore the Visual Studio toolset
        id: vs-cache
        if: steps.vs-key.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\vs-v141.7z
          key: ${{ steps.vs-key.outputs.key }}

      - name: Unpack the Visual Studio toolset
        if: steps.vs-cache.outputs.cache-hit == 'true'
        run: ./tools/ci/vs-toolset-cache.ps1 -Unpack "$env:RUNNER_TEMP\vs-v141.7z"

      - name: Install MSVC v141 toolset into Visual Studio 2022
        id: vs
        timeout-minutes: 45
        run: ./tools/ci/install-vs-components.ps1 -WindowsSdkVersion $env:WINSDK_VERSION -WindowsSdkComponent $env:WINSDK_COMPONENT -LogDir "$env:RUNNER_TEMP\build-logs\vs-installer"

      - name: Install Python 2.7
        id: python
        timeout-minutes: 15
        run: |
          $python = 'C:\Python27\python.exe'
          for ($attempt = 1; $attempt -le 2 -and -not (Test-Path -LiteralPath $python); $attempt++) {
            # python2 has no releases after 2.7.18. Do not request a specific
            # Chocolatey package revision: older mirrors can expose the final
            # Python release under a different package revision.
            choco install python2 -y --no-progress
            $code = $LASTEXITCODE
            Write-Host "choco exited with code $code (attempt $attempt)"
            if ($code -ne 0 -and $attempt -lt 2) { Start-Sleep -Seconds 10 }
          }
          if (-not (Test-Path -LiteralPath $python)) { throw "$python was not installed" }
          $version = & $python -c "import sys; sys.stdout.write('%d.%d.%d' % sys.version_info[:3])"
          if ($LASTEXITCODE -ne 0 -or -not "$version".StartsWith('2.7')) {
            throw "$python reports version '$version', expected 2.7"
          }
          Write-Host "Python $version at $python"

      - name: Install Cygwin
        id: cygwin
        timeout-minutes: 20
        uses: cygwin/cygwin-install-action@v6
        with:
          platform: x86_64
          install-dir: C:\cygwin64
          # util/invoke-unix.bat finds it through CYGPATH; on PATH its tools
          # would shadow Git's and Strawberry Perl's
          add-to-path: 'false'
          # make: ICU's build (prebuilt/build-libraries-windows.ps1)
          packages: flex bison m4 gawk sed grep curl tar bzip2 make

      # The prebuilt libraries are built here from source, as on Linux and
      # macOS (prebuilt/build-libraries-windows.ps1): OpenSSL, curl and ICU
      # from the releases pinned in prebuilt/versions, Thirdparty from
      # thirdparty/, all with the v141 toolset, and CEF repackaged from
      # Spotify's build (its SHA-1 pinned in prebuilt/cef-sha1sums), as
      # Release x86_64 archives in prebuilt/packaged. The cache key covers
      # what they are made from: the versions, the script and the CEF sums,
      # the thirdparty/ tree and the build settings the Thirdparty libraries
      # are compiled with. A cache miss builds them in this job (about 25
      # minutes).
      - name: Compute the prebuilt libraries cache key
        id: prebuilt-key
        env:
          SCRIPTS_HASH: ${{ hashFiles('prebuilt/versions/*', 'prebuilt/build-libraries-windows.ps1', 'prebuilt/cef-sha1sums', 'prebuilt/thirdparty.gyp', 'config/*.gypi', 'tools/ci/build-windows.ps1', 'make.cmd') }}
        run: |
          $thirdparty = (git rev-parse HEAD:thirdparty).Substring(0, 12)
          if ($LASTEXITCODE -ne 0) { throw 'git rev-parse HEAD:thirdparty failed' }
          $key = "prebuilt-win32-x86_64-v141_static_release-$($env:SCRIPTS_HASH.Substring(0, 16))-$thirdparty"
          Write-Host "Cache key: $key"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "key=$key" -Encoding utf8

      - name: Restore prebuilt libraries
        id: prebuilt-cache
        uses: actions/cache/restore@v6
        with:
          path: prebuilt/packaged
          key: ${{ steps.prebuilt-key.outputs.key }}

      # OpenSSL's assembler (AES-NI and the other fast, constant-time code)
      - name: Install NASM
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install nasm exited with code $LASTEXITCODE" }

      - name: Build OpenSSL, curl and ICU from source, repackage CEF
        id: prebuilt-build
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 90
        env:
          VSINSTALLDIR: ${{ steps.vs.outputs.install-path }}
        run: |
          ./prebuilt/build-libraries-windows.ps1 -Libraries OpenSSL, Curl, ICU, CEF -Arch x86_64 -Mode release
          Get-ChildItem -LiteralPath prebuilt/packaged | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      # The engine's own build files compile thirdparty/ (msbuild target
      # thirdparty-prebuilts, in build-win-x86_64, which the engine build
      # below reuses); its fetch step takes OpenSSL's headers (libpq and
      # libmysql use them) from the archives just built
      - name: Build the Thirdparty libraries from thirdparty/
        id: prebuilt-thirdparty
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 90
        env:
          VSINSTALLDIR: ${{ steps.vs.outputs.install-path }}
        run: |
          ./prebuilt/build-libraries-windows.ps1 -Libraries Thirdparty -Arch x86_64 -Mode release
          Get-ChildItem -LiteralPath prebuilt/packaged | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - name: Save prebuilt libraries to the cache
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: prebuilt/packaged
          key: ${{ steps.prebuilt-key.outputs.key }}

      # For developers who would rather not build them (BUILDING.md,
      # "Prebuilt libraries"): extracted into prebuilt\packaged, a local
      # build takes them as this one did
      - name: Upload the prebuilt libraries
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-libraries-win-x86_64
          path: prebuilt/packaged/*.tar.bz2
          if-no-files-found: error
          retention-days: 30
          # The archives are compressed already
          compression-level: 0

      # A login shell puts Cygwin's /usr/bin first on PATH and starts in the
      # home folder, hence the cd. "set -e" comes after the profile scripts.
      # The archives built above are copied from PREBUILT_LOCAL_DIR (and
      # taken as built here: they have no SHA256SUMS entries); nothing is
      # downloaded. PREBUILT_LOCAL_DIR stays set for the build, whose fetch
      # step runs the same script again.
      - name: Fetch prebuilt libraries
        id: prebuilt
        timeout-minutes: 30
        shell: C:\cygwin64\bin\bash.exe --login -o igncr '{0}'
        run: |
          set -eo pipefail
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/prebuilt"
          export PREBUILT_LOCAL_DIR="$PWD/packaged"
          echo "PREBUILT_LOCAL_DIR=$(cygpath -w "$PREBUILT_LOCAL_DIR")" >> "$GITHUB_ENV"
          ./fetch-libraries.sh win32 x86_64
          ls -l fetched
          ls unpacked

      - name: Configure (config.py and gyp)
        id: configure
        timeout-minutes: 20
        run: ./tools/ci/build-windows.ps1 -Stage configure

      - name: Build (make.cmd)
        id: compile
        timeout-minutes: 240
        env:
          VSINSTALLDIR: ${{ steps.vs.outputs.install-path }}
        run: ./tools/ci/build-windows.ps1 -Stage build

      - name: Verify build output
        id: verify
        run: ./tools/ci/verify-build.ps1

      # As with the prebuilt libraries, restore and save are separate steps
      # so that verified downloads are cached even when a later step fails.
      # tools/oxt/package.py verifies every cached archive against the
      # SHA-256 in the manifest before using it. The xTalk extensions'
      # files (prebuilt/fetched-assets/xtalk) have a cache of their own,
      # keyed on their manifest, so a new pin does not download the
      # runtimes archive again. The external-assets cache holds only the
      # archives (prebuilt/fetched-assets/*.zip; "zip" is the only asset
      # kind): actions/cache globs without implicit descendants and tar
      # archives a listed folder whole, so an exclusion such as
      # '!prebuilt/fetched-assets/xtalk' under a listed
      # 'prebuilt/fetched-assets' would not keep the xTalk files out. The
      # path must be the same in the save step (it is part of the cache
      # version).
      - name: Restore cached external assets
        id: assets-cache
        uses: actions/cache/restore@v6
        with:
          path: prebuilt/fetched-assets/*.zip
          key: oxt-external-assets-${{ hashFiles('tools/oxt/external-assets.json') }}

      - name: Restore cached xTalk extension files
        id: xtalk-cache
        uses: actions/cache/restore@v6
        with:
          path: prebuilt/fetched-assets/xtalk
          key: oxt-xtalk-extensions-${{ hashFiles('tools/oxt/xtalk-extensions.json') }}

      # Into the checkout, where package.py takes the IDE from
      - name: Download the documentation
        uses: actions/download-artifact@v8
        with:
          name: OXT-Beyond-docs-windows
          path: ide/Documentation/html_viewer/resources/data

      # package.py installs it in Runtime\Emscripten\js (OXT_WEB_RUNTIME)
      - name: Download the web runtime
        uses: actions/download-artifact@v8
        with:
          name: OXT-Beyond-web-windows
          path: ${{ runner.temp }}/web-runtime

      # Writes dist/stage/OXT-Beyond-<ver> (the installed layout), the
      # portable, binaries and symbols zips and SHA256SUMS.
      #
      # The external assets are left out (package-windows.ps1
      # -NoExternalAssets) when a manual run sets the input
      # no_external_assets, or when the repository variable
      # OXT_NO_EXTERNAL_ASSETS is 1, for example while a new asset is not
      # published yet. Likewise the xTalk Suite extensions with the input
      # no_xtalk_extensions or the variable OXT_NO_XTALK_EXTENSIONS
      # (package-windows.ps1 reads NO_XTALK_EXTENSIONS). Release builds (a
      # tag, or the input release from release.yml, also in its dry runs)
      # always include both, and also write
      # OXT-Beyond-<ver>-xtalk-sources.zip (-XtalkSourcesZip): the pinned
      # xTalk files, which the packages otherwise take live from the member
      # repositories, kept with the release. It is written here only: the
      # Linux and macOS packages take the same pinned files, and the
      # release takes this one copy for all of them (a job of its own would
      # fetch them all again, and the publishing job, which may write to
      # the repository, should not fetch from other repositories).
      # package-windows.ps1 finds the Visual C++ redistributable folder of
      # the runner's Visual Studio with vswhere and bundles the runtime DLLs
      # that enetxt and box2dxt import.
      - name: Package
        id: package
        timeout-minutes: 45
        env:
          OXT_ASSETS_CACHE: ${{ github.workspace }}\prebuilt\fetched-assets
          OXT_WEB_RUNTIME: ${{ runner.temp }}\web-runtime
          NO_EXTERNAL_ASSETS: ${{ github.ref_type != 'tag' && !inputs.release && (inputs.no_external_assets == true || vars.OXT_NO_EXTERNAL_ASSETS == '1') }}
          NO_XTALK_EXTENSIONS: ${{ github.ref_type != 'tag' && !inputs.release && (inputs.no_xtalk_extensions == true || vars.OXT_NO_XTALK_EXTENSIONS == '1') }}
          # Also on main (a push, or a run by hand there), so that
          # release.yml can publish that build's packages, unless the
          # extensions are left out, which the zip needs
          XTALK_SOURCES_ZIP: ${{ github.ref_type == 'tag' || inputs.release == true || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.no_xtalk_extensions != true && vars.OXT_NO_XTALK_EXTENSIONS != '1') }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build-logs\package.log'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $log) | Out-Null
          $packageArgs = @{}
          if ($env:NO_EXTERNAL_ASSETS -eq 'true') {
            Write-Host '::warning title=Package::External assets left out (no_external_assets input or OXT_NO_EXTERNAL_ASSETS variable): the packages have no standalone runtimes for other platforms.'
            $packageArgs['NoExternalAssets'] = $true
          }
          if ($env:NO_XTALK_EXTENSIONS -eq 'true') {
            Write-Host '::warning title=Package::xTalk Suite extensions left out (no_xtalk_extensions input or OXT_NO_XTALK_EXTENSIONS variable).'
          }
          if ($env:XTALK_SOURCES_ZIP -eq 'true') { $packageArgs['XtalkSourcesZip'] = $true }
          $global:LASTEXITCODE = 0
          ./tools/ci/package-windows.ps1 @packageArgs *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "package-windows.ps1 failed with exit code $LASTEXITCODE" }

      - name: Save external assets to the cache
        if: always() && steps.assets-cache.outputs.cache-hit != 'true' && hashFiles('prebuilt/fetched-assets/*.zip') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: prebuilt/fetched-assets/*.zip
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}

      - name: Save xTalk extension files to the cache
        if: always() && steps.xtalk-cache.outputs.cache-hit != 'true' && hashFiles('prebuilt/fetched-assets/xtalk/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: prebuilt/fetched-assets/xtalk
          key: ${{ steps.xtalk-cache.outputs.cache-primary-key }}

      # Every DLL in Extensions/**/code/*-win32 must import only Windows
      # system DLLs and DLLs in its own folder; otherwise it cannot load on
      # a PC without the missing DLL (for example the Visual C++
      # redistributable, which CI runners always have).
      - name: Check extension DLL imports
        id: check_imports
        env:
          VERSION: ${{ steps.product.outputs.version }}
        run: ./tools/ci/check-extension-imports.ps1 -Root "dist/stage/OXT-Beyond-$env:VERSION"

      # Extract the portable zip and run its engine (OXT-Beyond.exe) without
      # a user interface: the script engine, ICU, OpenSSL, SQLite (revDB and
      # the driver in Externals\Database Drivers), revXML and revZip, and
      # every bundled xTalk Suite extension (loaded and called).
      - name: Smoke test (portable zip, headless)
        id: smoke
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.product.outputs.version }}
        run: |
          $package = "dist/OXT-Beyond-$env:VERSION-win-x86_64-portable.zip"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw "$package was not written" }
          ./tools/ci/smoke-test.ps1 -Package $package -LogFile "$env:RUNNER_TEMP\build-logs\smoke-test-portable.log"

      # A standalone built from each runtime of the portable zip
      # (Windows x86-64 and x86, Linux x86-64 and x86) by its engine, as the
      # IDE's builder does at its core ("_internal deploy"); the Windows
      # ones are run (this runner runs both architectures), the Linux ones
      # checked as ELF files. tools/ci/standalone_check.py extracts the zip
      # to a neutral folder and checks each runtime folder's binaries first.
      - name: Standalone check
        id: standalone
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.product.outputs.version }}
        run: python tools/ci/standalone_check.py --package "dist/OXT-Beyond-$env:VERSION-win-x86_64-portable.zip" --platform win-x86_64 --targets all --log "$env:RUNNER_TEMP\build-logs\standalone-check.log"

      # The browser widget, revBrowser (CEF) and the player (DirectShow) in a
      # standalone of the portable zip, with the runner's desktop: a page
      # loads and its JavaScript calls back into the script, a WAV and an
      # MP4 file play, pause and end (tools/ci/media_check.py)
      - name: Browser and player check
        id: media_check
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.product.outputs.version }}
        run: python tools/ci/media_check.py --package "dist/OXT-Beyond-$env:VERSION-win-x86_64-portable.zip" --platform win-x86_64 --log "$env:RUNNER_TEMP\build-logs\media-check.log"

      # Compile every IDE script of the staged installed layout with its
      # engine; fails on compile errors that are not in the baseline.
      - name: IDE compile check
        id: compile_check
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.product.outputs.version }}
        run: ./tools/ci/ide-compile-check.ps1 -Root "dist/stage/OXT-Beyond-$env:VERSION" -LogFile "$env:RUNNER_TEMP\build-logs\ide-compile-check.log"

      # The engine test suites of tests/ (tools/ci/run_engine_tests.py): the
      # LiveCode Script tests of tests/lcs, each run on its own by the
      # build's standalone engine (win-x86_64-bin) with -ui and a time
      # limit, the extensions' own tests (extensions/**/tests) run the
      # same way, the LiveCode Builder tests (each handler in its own
      # lc-run), and the LiveCode Builder compiler and LiveCode Script
      # parser tests.
      # A failure that is not in tools/ci/engine-tests-baseline.txt
      # or its Windows supplement fails the step (a failed test is run once
      # more first, and one that then passes is only reported as flaky). A
      # test that crashes the engine is run again under
      # tools/ci/win_crashtrace.py, which logs the stack with the .pdb files
      # next to the binaries. The job summary lists the failures and the
      # baseline entries that passed; the log has every failed test's
      # output. CI is "true" here, so the tests that act on the desktop
      # (they start and end Notepad, and set the clipboard) run too. --jobs
      # 4: the tests of four files at a time.
      - name: Engine tests
        id: engine_tests
        timeout-minutes: 45
        run: python tools/ci/run_engine_tests.py --bin win-x86_64-bin --jobs 4 --log "$env:RUNNER_TEMP\build-logs\engine-tests.log"

      - name: Build installer
        id: installer
        timeout-minutes: 60
        env:
          VERSION: ${{ steps.product.outputs.version }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build-logs\build-installer.log'
          $global:LASTEXITCODE = 0
          ./tools/ci/build-installer.ps1 -Stage "dist/stage/OXT-Beyond-$env:VERSION" -OutDir dist *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "build-installer.ps1 failed with exit code $LASTEXITCODE" }

      # Install per user into a temporary folder, check the files, run the
      # smoke test on the installed OXT-Beyond.exe and uninstall again.
      - name: Test installer
        id: test_installer
        timeout-minutes: 30
        env:
          VERSION: ${{ steps.product.outputs.version }}
        run: |
          $setup = "dist/OXT-Beyond-$env:VERSION-win-x86_64-setup.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "$setup was not written" }
          $log = Join-Path $env:RUNNER_TEMP 'build-logs\test-installer.log'
          $global:LASTEXITCODE = 0
          ./tools/ci/test-installer.ps1 -Setup $setup *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "test-installer.ps1 failed with exit code $LASTEXITCODE" }

      - name: Upload packages
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: OXT-Beyond-win-x86_64
          # Everything in dist except the staged layout
          path: |
            dist/*
            !dist/stage
            !dist/stage/**
          if-no-files-found: error
          retention-days: 30
          # The files are compressed already
          compression-level: 0

      # The installer again, alone and not zipped, for trying a build
      # without downloading the whole set above (about 1.2 GB): with archive
      # false the artifact is the file itself, named after it. Releases take
      # the set above only, by its name.
      - name: Upload the installer alone
        id: upload_setup
        uses: actions/upload-artifact@v7
        with:
          path: dist/OXT-Beyond-${{ steps.product.outputs.version }}-win-x86_64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      # The IDE's own windows, as a user sees them with Windows light and
      # dark: tools/ci/ui_tour.py starts the staged IDE with
      # tools/ci/ui-tour.livecodescript, which opens the palettes, the
      # inspector (each section), the editors, each pane of Preferences and
      # each card of the Standalone Settings, the dictionary, dialogs and
      # two tooltips one by one and snapshots each. A step that fails or a
      # script error in the IDE fails the check. The snapshots go with the
      # logs and are printed into this log (tools/ci/print_images.py).
      - name: IDE screenshots, light
        id: ui_tour_light
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.product.outputs.version }}
        run: python tools/ci/ui_tour.py --install "dist/stage/OXT-Beyond-$env:VERSION" --platform win-x86_64 --appearance light --out "$env:RUNNER_TEMP\build-logs\ui-tour\light"

      - name: IDE screenshots, dark
        id: ui_tour_dark
        if: ${{ !cancelled() && steps.ui_tour_light.conclusion != 'skipped' }}
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.product.outputs.version }}
        run: python tools/ci/ui_tour.py --install "dist/stage/OXT-Beyond-$env:VERSION" --platform win-x86_64 --appearance dark --out "$env:RUNNER_TEMP\build-logs\ui-tour\dark"

      # For a person to look through: a page with each window light and
      # dark side by side (tools/ci/ui_tour_page.py), uploaded with the
      # snapshots and the tour's lines as an artifact of their own, which
      # the job summary links; after a push to main, ide-screenshots.yml
      # puts the newest of each platform on the branch ide-screenshots
      - name: IDE screenshots, review page
        if: ${{ !cancelled() && steps.ui_tour_light.conclusion != 'skipped' }}
        run: python tools/ci/ui_tour_page.py "$env:RUNNER_TEMP\build-logs\ui-tour" --title "Windows x86_64"

      - name: Upload the IDE screenshots
        id: ui_tour_upload
        if: ${{ !cancelled() && steps.ui_tour_light.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: ide-screenshots-win-x86_64
          path: |
            ${{ runner.temp }}/build-logs/ui-tour/index.html
            ${{ runner.temp }}/build-logs/ui-tour/*/shots
            ${{ runner.temp }}/build-logs/ui-tour/*/tour.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: IDE screenshots, link in the summary
        if: ${{ !cancelled() && steps.ui_tour_light.conclusion != 'skipped' }}
        env:
          URL: ${{ steps.ui_tour_upload.outputs.artifact-url }}
        run: python tools/ci/ui_tour_page.py "$env:RUNNER_TEMP\build-logs\ui-tour" --title "Windows x86_64" --summary --url="$env:URL"

      # An HTML5 standalone, as a user makes one: tools/ci/web_check.py
      # starts the staged IDE with tools/ci/web-deploy.livecodescript,
      # which builds a probe stack with the IDE's web builder (the web
      # runtime that package.py installed, and the Internet library with
      # its web driver); the standalone is then served on 127.0.0.1 and
      # opened in headless Chromium, where the probe checks waits, timers,
      # JavaScript, files, URLs and dialogs, and the check clicks, types and
      # looks at what it draws. Playwright, pinned, in a virtual environment
      # of its own. The probe's screenshot and the IDE's lines go with the
      # logs.
      - name: Web standalone check
        id: web_check
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.product.outputs.version }}
          PLAYWRIGHT_VERSION: 1.56.0
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'playwright'
          $work = Join-Path $env:RUNNER_TEMP 'web-check'
          $logs = Join-Path $env:RUNNER_TEMP 'build-logs\web-check'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'python -m venv failed' }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --quiet "playwright==$env:PLAYWRIGHT_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'pip install playwright failed' }
          & $python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'playwright install chromium failed' }
          try {
            & $python tools/ci/web_check.py --install "dist/stage/OXT-Beyond-$env:VERSION" --platform win-x86_64 --work $work
            $code = $LASTEXITCODE
          }
          finally {
            New-Item -ItemType Directory -Force -Path $logs | Out-Null
            Get-ChildItem -LiteralPath $work -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.png', '.txt' } |
              Copy-Item -Destination $logs -Force
          }
          if ($code -ne 0) { throw "web_check.py failed with exit code $code" }

      - name: Collect logs
        id: collect_logs
        if: always()
        continue-on-error: true
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'build-logs'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $logs = @(
            'build-win-x86_64\msbuild.log',
            'C:\ProgramData\chocolatey\logs\chocolatey.log',
            'C:\cygwin64\var\log\setup.log.full'
          )
          foreach ($log in $logs) {
            if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log -Destination $dest -Force }
          }
          # configure's own logs of a prebuilt library build (ICU, curl's
          # CMake), named after their folder
          $prebuiltWork = 'prebuilt\build\windows'
          if (Test-Path -LiteralPath $prebuiltWork) {
            foreach ($f in @(Get-ChildItem -LiteralPath $prebuiltWork -Recurse -File -Include 'config.log', 'CMakeError.log', 'CMakeConfigureLog.yaml' -ErrorAction SilentlyContinue)) {
              $name = ($f.FullName.Substring((Resolve-Path $prebuiltWork).ProviderPath.Length + 1) -replace '[\\/]', '_')
              Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $dest "prebuilt-$name") -Force
            }
          }
          Get-ChildItem -LiteralPath $dest -Recurse -File | ForEach-Object {
            Write-Host ('{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($dest.Length + 1))
          }
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used } | ForEach-Object {
            Write-Host ('Drive {0}: {1:N1} GB free' -f $_.Name, ($_.Free / 1GB))
          }

      - name: Report failure diagnostics
        if: failure()
        continue-on-error: true
        env:
          IDE_LINT_OUTCOME: ${{ steps.ide_lint.outcome }}
          VS_OUTCOME: ${{ steps.vs.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          CYGWIN_OUTCOME: ${{ steps.cygwin.outcome }}
          PREBUILT_BUILD_OUTCOME: ${{ steps.prebuilt-build.outcome }}
          PREBUILT_THIRDPARTY_OUTCOME: ${{ steps.prebuilt-thirdparty.outcome }}
          PREBUILT_OUTCOME: ${{ steps.prebuilt.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          CHECK_IMPORTS_OUTCOME: ${{ steps.check_imports.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          STANDALONE_OUTCOME: ${{ steps.standalone.outcome }}
          MEDIA_CHECK_OUTCOME: ${{ steps.media_check.outcome }}
          COMPILE_CHECK_OUTCOME: ${{ steps.compile_check.outcome }}
          INSTALLER_OUTCOME: ${{ steps.installer.outcome }}
          TEST_INSTALLER_OUTCOME: ${{ steps.test_installer.outcome }}
        run: |
          $outcomes = [ordered]@{
            'Lint IDE sources' = $env:IDE_LINT_OUTCOME
            'Visual Studio setup' = $env:VS_OUTCOME
            'Python setup' = $env:PYTHON_OUTCOME
            'Cygwin setup' = $env:CYGWIN_OUTCOME
            'Build OpenSSL, curl, ICU' = $env:PREBUILT_BUILD_OUTCOME
            'Build Thirdparty' = $env:PREBUILT_THIRDPARTY_OUTCOME
            'Prebuilt libraries' = $env:PREBUILT_OUTCOME
            'Configure' = $env:CONFIGURE_OUTCOME
            'Compile' = $env:COMPILE_OUTCOME
            'Verify' = $env:VERIFY_OUTCOME
            'Package' = $env:PACKAGE_OUTCOME
            'Extension DLL imports' = $env:CHECK_IMPORTS_OUTCOME
            'Smoke test' = $env:SMOKE_OUTCOME
            'Standalone check' = $env:STANDALONE_OUTCOME
            'Browser and player check' = $env:MEDIA_CHECK_OUTCOME
            'IDE compile check' = $env:COMPILE_CHECK_OUTCOME
            'Build installer' = $env:INSTALLER_OUTCOME
            'Test installer' = $env:TEST_INSTALLER_OUTCOME
          }
          Write-Host 'Step outcomes:'
          $summary = @('### Failure diagnostics', '', '| Step | Outcome |', '| --- | --- |')
          foreach ($item in $outcomes.GetEnumerator()) {
            Write-Host ('  {0,-22} {1}' -f $item.Key, $item.Value)
            $summary += "| $($item.Key) | $($item.Value) |"
          }

          $msbuildLog = 'build-win-x86_64\msbuild.log'
          if (Test-Path -LiteralPath $msbuildLog) {
            # Put a bounded error extract in both the live log and job summary.
            # The complete file remains available in the build-logs-win-x86_64 artifact.
            $errors = @(Select-String -LiteralPath $msbuildLog -Pattern '(^|[ :(])error (C|LNK|MSB)[0-9]+|fatal error' |
              Select-Object -First 50 | ForEach-Object { $_.Line.Trim() })
            if ($errors.Count -eq 0) {
              $errors = @(Get-Content -LiteralPath $msbuildLog -Tail 80)
            }
            Write-Host 'Relevant msbuild.log lines:'
            $errors | ForEach-Object { Write-Host $_ }
            $summary += @('', '#### Relevant `msbuild.log` lines', '', '```text')
            $summary += $errors
            $summary += '```'
          }
          else {
            $summary += @('', '`msbuild.log` was not created; the failure occurred before compilation.')
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join "`n") -Encoding utf8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Named after the platform: in a release run the three platforms'
          # artifacts share one list
          name: build-logs-win-x86_64
          path: ${{ runner.temp }}/build-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Write job summary
        if: always()
        env:
          MSVC_V141: ${{ steps.vs.outputs.msvc-v141-version }}
          VS_PATH: ${{ steps.vs.outputs.install-path }}
          VERSION: ${{ steps.product.outputs.version }}
          BUILD_NUMBER: ${{ steps.product.outputs.build-number }}
          ENGINE_VERSION: ${{ steps.verify.outputs.version }}
          SQLITE_VERSION: ${{ steps.verify.outputs.sqlite-version }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          SETUP_URL: ${{ steps.upload_setup.outputs.artifact-url }}
        run: |
          $lines = @(
            '### Toolchain',
            '',
            "- Commit: ``$env:GITHUB_SHA``",
            "- Visual Studio: ``$env:VS_PATH``, MSVC v141 ``$env:MSVC_V141``, Windows SDK ``$env:WINSDK_VERSION``",
            "- OXT-Beyond ``$env:VERSION``, build number ``$env:BUILD_NUMBER``; engine ``$env:ENGINE_VERSION``, SQLite ``$env:SQLITE_VERSION``",
            '',
            '### Artifacts',
            ''
          )
          if ($env:ARTIFACT_URL) {
            $lines += "- [OXT-Beyond-win-x86_64]($env:ARTIFACT_URL): the installer, the portable, binaries and symbols zips (in release builds also the xTalk sources zip) and SHA256SUMS"
          }
          else {
            $lines += '- OXT-Beyond-win-x86_64: not uploaded (an earlier step failed)'
          }
          if ($env:SETUP_URL) {
            $lines += "- [OXT-Beyond-$env:VERSION-win-x86_64-setup.exe]($env:SETUP_URL): the installer alone, not zipped"
          }
          $lines += '- build-logs-win-x86_64: msbuild.log and the packaging, smoke test, standalone check, IDE compile check and installer logs'
          $lines += ''
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n") -Encoding utf8

  # The 32-bit Windows build, for the standalone runtime
  # Runtime/Windows/x86-32 (the IDE's "Windows" target), which the runtimes
  # asset carries for every package (tools/oxt/make_runtimes_asset.py
  # --builds). The toolchain and the prebuilt libraries of the job above,
  # for x86: prebuilt/build-libraries-windows.ps1 -Arch x86 (CEF from
  # Spotify's 32-bit build of the same version), config.py --platform
  # win-x86 and make.cmd with the Win32 platform. It is checked like the
  # x86-64 build (verify-build.ps1, the headless smoke test of the build
  # output, the engine tests), on the same 64-bit Windows, which runs 32-bit
  # programs. Outputs: win-x86-bin without its .pdb files as the artifact
  # OXT-Beyond-win-x86-bin, the .pdb files as OXT-Beyond-win-x86-symbols;
  # nothing is packaged.
  build-x86:
    name: Build win-x86
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      BUILDTYPE: Release
      BUILD_PLATFORM: win-x86
      WINSDK_VERSION: 10.0.17763.0
      WINSDK_COMPONENT: Microsoft.VisualStudio.Component.Windows10SDK.17763
      CYGPATH: C:\cygwin64
      PREBUILT_WIN32_SUBPLATFORMS: v141_static_release
      PREBUILT_STRICT: '1'

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      # As in the job above. This job also saves the toolset: it is not on
      # the critical path (it packages nothing). Only main's builds save
      # (and runs started by hand on a branch, which only that branch's
      # runs can read), so pull requests and releases restore what main
      # installed.
      - name: Compute the Visual Studio toolset cache key
        id: vs-key
        env:
          SCRIPTS_HASH: ${{ hashFiles('tools/ci/install-vs-components.ps1', 'tools/ci/vs-toolset-cache.ps1') }}
        run: |
          if (-not $env:ImageOS -or -not $env:ImageVersion) {
            Write-Host '::warning::ImageOS or ImageVersion is not set: the Visual Studio toolset is not cached'
            exit 0
          }
          "key=vs-v141-$env:ImageOS-$env:ImageVersion-$env:WINSDK_VERSION-$($env:SCRIPTS_HASH.Substring(0, 16))-v1" |
            Add-Content $env:GITHUB_OUTPUT

      - name: Restore the Visual Studio toolset
        id: vs-cache
        if: steps.vs-key.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\vs-v141.7z
          key: ${{ steps.vs-key.outputs.key }}

      - name: Unpack the Visual Studio toolset
        if: steps.vs-cache.outputs.cache-hit == 'true'
        run: ./tools/ci/vs-toolset-cache.ps1 -Unpack "$env:RUNNER_TEMP\vs-v141.7z"

      - name: List the Visual Studio files before the installer
        id: vs-before
        if: >-
          steps.vs-key.outputs.key != '' && steps.vs-cache.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')))
        continue-on-error: true
        run: ./tools/ci/vs-toolset-cache.ps1 -List "$env:RUNNER_TEMP\vs-before.tsv"

      - name: Install MSVC v141 toolset into Visual Studio 2022
        id: vs
        timeout-minutes: 45
        run: ./tools/ci/install-vs-components.ps1 -WindowsSdkVersion $env:WINSDK_VERSION -WindowsSdkComponent $env:WINSDK_COMPONENT -LogDir "$env:RUNNER_TEMP\build-logs\vs-installer"

      - name: Pack the Visual Studio toolset
        id: vs-pack
        if: steps.vs-before.outcome == 'success'
        continue-on-error: true
        run: ./tools/ci/vs-toolset-cache.ps1 -Pack "$env:RUNNER_TEMP\vs-before.tsv" -Archive "$env:RUNNER_TEMP\vs-v141.7z"

      - name: Save the Visual Studio toolset to the cache
        if: steps.vs-pack.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\vs-v141.7z
          key: ${{ steps.vs-key.outputs.key }}

      - name: Install Python 2.7
        timeout-minutes: 15
        run: |
          $python = 'C:\Python27\python.exe'
          for ($attempt = 1; $attempt -le 2 -and -not (Test-Path -LiteralPath $python); $attempt++) {
            choco install python2 -y --no-progress
            Write-Host "choco exited with code $LASTEXITCODE (attempt $attempt)"
            if ($LASTEXITCODE -ne 0 -and $attempt -lt 2) { Start-Sleep -Seconds 10 }
          }
          if (-not (Test-Path -LiteralPath $python)) { throw "$python was not installed" }

      - name: Install Cygwin
        timeout-minutes: 20
        uses: cygwin/cygwin-install-action@v6
        with:
          platform: x86_64
          install-dir: C:\cygwin64
          add-to-path: 'false'
          packages: flex bison m4 gawk sed grep curl tar bzip2 make

      # As in the job above, for x86
      - name: Compute the prebuilt libraries cache key
        id: prebuilt-key
        env:
          SCRIPTS_HASH: ${{ hashFiles('prebuilt/versions/*', 'prebuilt/build-libraries-windows.ps1', 'prebuilt/cef-sha1sums', 'prebuilt/thirdparty.gyp', 'config/*.gypi', 'tools/ci/build-windows.ps1', 'make.cmd') }}
        run: |
          $thirdparty = (git rev-parse HEAD:thirdparty).Substring(0, 12)
          if ($LASTEXITCODE -ne 0) { throw 'git rev-parse HEAD:thirdparty failed' }
          $key = "prebuilt-win32-x86-v141_static_release-$($env:SCRIPTS_HASH.Substring(0, 16))-$thirdparty"
          Write-Host "Cache key: $key"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "key=$key" -Encoding utf8

      - name: Restore prebuilt libraries
        id: prebuilt-cache
        uses: actions/cache/restore@v6
        with:
          path: prebuilt/packaged
          key: ${{ steps.prebuilt-key.outputs.key }}

      - name: Install NASM
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install nasm exited with code $LASTEXITCODE" }

      - name: Build OpenSSL, curl and ICU from source, repackage CEF
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 90
        env:
          VSINSTALLDIR: ${{ steps.vs.outputs.install-path }}
        run: |
          ./prebuilt/build-libraries-windows.ps1 -Libraries OpenSSL, Curl, ICU, CEF -Arch x86 -Mode release
          Get-ChildItem -LiteralPath prebuilt/packaged | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - name: Build the Thirdparty libraries from thirdparty/
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 90
        env:
          VSINSTALLDIR: ${{ steps.vs.outputs.install-path }}
        run: |
          ./prebuilt/build-libraries-windows.ps1 -Libraries Thirdparty -Arch x86 -Mode release
          Get-ChildItem -LiteralPath prebuilt/packaged | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - name: Save prebuilt libraries to the cache
        if: steps.prebuilt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: prebuilt/packaged
          key: ${{ steps.prebuilt-key.outputs.key }}

      - name: Fetch prebuilt libraries
        timeout-minutes: 30
        shell: C:\cygwin64\bin\bash.exe --login -o igncr '{0}'
        run: |
          set -eo pipefail
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/prebuilt"
          export PREBUILT_LOCAL_DIR="$PWD/packaged"
          echo "PREBUILT_LOCAL_DIR=$(cygpath -w "$PREBUILT_LOCAL_DIR")" >> "$GITHUB_ENV"
          ./fetch-libraries.sh win32 x86
          ls -l fetched
          ls unpacked

      - name: Configure (config.py and gyp)
        timeout-minutes: 20
        run: ./tools/ci/build-windows.ps1 -Stage configure

      - name: Build (make.cmd)
        timeout-minutes: 240
        env:
          VSINSTALLDIR: ${{ steps.vs.outputs.install-path }}
        run: ./tools/ci/build-windows.ps1 -Stage build

      - name: Verify build output
        run: ./tools/ci/verify-build.ps1 -BinDir win-x86-bin

      # Uploaded before the tests, so that a failing test leaves the build
      # output to look at (as the Linux x86 job does)
      # 7-Zip is on the runner image; both archives hold the folder
      # win-x86-bin, so the symbols can be extracted over the binaries
      - name: Package the bin folder and the debug symbols
        run: |
          $7z = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          & $7z a -tzip -mx=7 OXT-Beyond-win-x86-bin.zip win-x86-bin '-xr!*.pdb'
          if ($LASTEXITCODE -ne 0) { throw "7z exited with code $LASTEXITCODE" }
          & $7z a -tzip -mx=7 OXT-Beyond-win-x86-symbols.zip '-ir!win-x86-bin\*.pdb'
          if ($LASTEXITCODE -ne 0) { throw "7z exited with code $LASTEXITCODE" }
          Get-Item OXT-Beyond-win-x86-*.zip | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - name: Upload the bin folder
        uses: actions/upload-artifact@v7
        with:
          name: OXT-Beyond-win-x86-bin
          path: OXT-Beyond-win-x86-bin.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload the debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: OXT-Beyond-win-x86-symbols
          path: OXT-Beyond-win-x86-symbols.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # The build output's development engine, headless: the script engine,
      # ICU, OpenSSL, SQLite, revXML and revZip, as 32-bit code
      - name: Smoke test (build output, headless)
        timeout-minutes: 15
        env:
          OXT_EXPECT_PROCESSOR: x86
        run: ./tools/ci/smoke-test.ps1 -BinDir win-x86-bin -LogFile "$env:RUNNER_TEMP\build-logs\smoke-test.log"

      - name: Engine tests
        timeout-minutes: 45
        run: python tools/ci/run_engine_tests.py --bin win-x86-bin --arch x86 --jobs 4 --log "$env:RUNNER_TEMP\build-logs\engine-tests.log"

      # A standalone built from this build's runtime (standalone-community.exe)
      # by its development engine, as the IDE's builder does at its core,
      # then run as the 32-bit program it is (tools/ci/standalone_check.py)
      - name: Standalone check (build output)
        timeout-minutes: 15
        run: python tools/ci/standalone_check.py --engine win-x86-bin/LiveCode-Community.exe --runtime win-x86-bin/standalone-community.exe --platform win-x86 --log "$env:RUNNER_TEMP\build-logs\standalone-check.log"

      - name: Collect logs
        if: always()
        continue-on-error: true
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'build-logs'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($log in @('build-win-x86\msbuild.log', 'C:\ProgramData\chocolatey\logs\chocolatey.log')) {
            if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log -Destination $dest -Force }
          }
          $prebuiltWork = 'prebuilt\build\windows'
          if (Test-Path -LiteralPath $prebuiltWork) {
            foreach ($f in @(Get-ChildItem -LiteralPath $prebuiltWork -Recurse -File -Include 'config.log', 'CMakeError.log', 'CMakeConfigureLog.yaml' -ErrorAction SilentlyContinue)) {
              $name = ($f.FullName.Substring((Resolve-Path $prebuiltWork).ProviderPath.Length + 1) -replace '[\\/]', '_')
              Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $dest "prebuilt-$name") -Force
            }
          }
          $msbuildLog = 'build-win-x86\msbuild.log'
          if (Test-Path -LiteralPath $msbuildLog) {
            $errors = @(Select-String -LiteralPath $msbuildLog -Pattern '(^|[ :(])error (C|LNK|MSB)[0-9]+|fatal error' |
              Select-Object -First 50 | ForEach-Object { $_.Line.Trim() })
            if ($errors.Count -gt 0) {
              Write-Host 'msbuild.log errors:'
              $errors | ForEach-Object { Write-Host $_ }
            }
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-win-x86
          path: ${{ runner.temp }}/build-logs
          if-no-files-found: ignore
          retention-days: 14
