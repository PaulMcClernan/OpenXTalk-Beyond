# The quick checks of the workflows and of the CI scripts that need no build,
# on every pull request and push to main, in a minute or two on one Linux
# runner, so that a mistake in them shows before (or instead of) the hour of
# building:
#
#   - actionlint checks every workflow: syntax, expressions, job and step
#     references, the inputs of reusable workflows and actions (the shell
#     scripts in the steps are not checked: -shellcheck= turns that off);
#   - tools/ci/tests runs the unit tests of the CI scripts: the build
#     workflows' paths-ignore lists (a change to a file a build uses starts
#     that build), the checks release.yml makes on the packages before it
#     publishes them (tools/ci/release_assets.py, release_notes.py), and
#     the text dictionary's generator (tools/oxt/text_dictionary.py);
#   - tools/ci/changelog.py check: the changelog fragments of changelog
#     are CHANGELOG.md's "- " lines, ready to fold into it;
#   - tools/ci/runtimes_provenance.py: how many commits that change the
#     engine's source the runtimes asset (the other platforms' standalone
#     runtimes) is behind, as a warning in the job summary.
#
# The job CI scripts on Windows and macOS runs the same unit tests on
# windows-latest and macos-15 (modernization report MOD-06): the build
# workflows run these scripts there too, so a script that only works on
# Linux shows here.
#
# A change to this workflow or to the tests alone starts no build (the build
# workflows' paths-ignore lists have them).

name: CI checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Workflows and CI scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # (the whole history: the runtimes' provenance step looks back to
      # the commit the runtimes asset was built from)
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pinned release, checked against its published SHA-256
      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

      - name: Test the CI scripts
        run: |
          python3 --version
          # PyYAML reads the workflows (the runner image has it; installed
          # only where it does not)
          python3 -c 'import yaml' 2>/dev/null ||
            python3 -m pip install --user --break-system-packages pyyaml
          python3 -m unittest discover -s tools/ci/tests -v

      - name: Check the changelog fragments
        run: python3 tools/ci/changelog.py check

      # A warning in the summary, never a failure here: an engine change
      # must not turn every pull request red. The release is where it fails:
      # "Tag a release" runs this with --fail-on-stale (BUILDING.md section
      # 10, step 1), so every release carries runtimes of its own engine
      - name: Runtimes asset provenance
        run: python3 tools/ci/runtimes_provenance.py

  other-os:
    name: CI scripts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      # The files as they are in git, LF line endings and all, as the
      # Linux job sees them (Windows' git would make them CRLF).
      # .gitattributes marks the sources "text", which checks them out
      # with core.eol whatever core.autocrlf says, so both are set
      - name: Keep LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the CI scripts
        run: |
          python --version
          python -m pip install --quiet pyyaml
          python -m unittest discover -s tools/ci/tests -v
