name: Bug report
description: Something in OXT-Beyond does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        - **Security problems:** do not report them here. See [SECURITY.md](https://github.com/SethMorrowSoftware/OpenXTalk-Beyond/security/policy).
        - **Problems building from source:** use the "Build problem" form instead.
        - **Questions about scripting:** the [OpenXTalk forums](https://openxtalk.org/forum/) are a better place.

        Please check that the problem has not been reported already.

  - type: input
    id: version
    attributes:
      label: OXT-Beyond version
      description: >
        Shown in the title of the menubar window (for example "OXT-Beyond
        0.2.0"), in the name of the file you downloaded, or in `ide/.version`
        of a source checkout. Add the build number from Preferences >
        Automatic Updates if you can. If you built it yourself, add the
        commit (`git rev-parse --short HEAD`).
      placeholder: 0.2.4, build 202610101200
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Where did you get it?
      options:
        - A file from the GitHub Releases page (installer, portable zip, disk image or tar.xz)
        - Development build (GitHub Actions artifact)
        - I built it myself
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: The computer OXT-Beyond runs on. On a Mac, Apple menu > About This Mac shows the chip (Apple M1, M2 and so on) or the Intel processor.
      options:
        - Windows x64
        - macOS Apple Silicon
        - macOS Intel
        - Linux x86-64
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: >
        Windows: run `winver`. macOS: Apple menu > About This Mac. Linux: the
        distribution and its version (for example the PRETTY_NAME line of
        `/etc/os-release`), and the desktop (X11 or Wayland) if the problem
        is with windows or the display.
      placeholder: Windows 11 24H2 (OS build 26100.1234), macOS 15.6, Ubuntu 24.04.3 LTS
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What do you do to make the problem happen? Start from launching the IDE.
      placeholder: |
        1. Create a new stack.
        2. Add a button with this script: ...
        3. Click the button.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: >
        Copy and paste any error message exactly. A screenshot helps with
        display problems (for example dark mode).
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Sample script or stack
      description: >
        The smallest script that shows the problem, in a code block. You can
        also attach a stack: zip it and drag the zip into this box.

  - type: dropdown
    id: upstream
    attributes:
      label: Does the same thing happen in OpenXTalk Lite 1.15 or LiveCode Community 9.6.3?
      description: This helps tell new problems from ones inherited from OpenXTalk Lite or LiveCode.
      options:
        - I don't know
        - "Yes"
        - "No"
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Other software involved (database servers, fonts, screen scaling, antivirus), or anything else that might matter.
