<style>
/* Layout: a reference tool. Sticky tab bar, one view at a time; each view is summary first, then sortable detail. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18212b; --muted:#5b6774; --line:#d9dee4; --soft:#eef1f4;
  --accent:#1f6aa5; --accent-soft:#dcebf7;
  --ok:#2f7d4f; --warn:#b26b00; --crit:#b3261e; --warn-soft:#fbefd9; --crit-soft:#f8dedb;
  --e-build:#7a5aa8; --e-script:#1f6aa5; --e-lcb:#2f7d4f; --e-boot:#b26b00; --e-other:#7d8894;
  --f-display:"Chivo",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#18202a; --ink:#e3e8ee; --muted:#9aa6b2; --line:#2c3743; --soft:#1f2934;
  --accent:#6cb3ea; --accent-soft:#1b3348;
  --ok:#6cc08d; --warn:#e9a640; --crit:#f07a70; --warn-soft:#3a2d16; --crit-soft:#3d1f1d;
  --e-build:#b39be0; --e-script:#6cb3ea; --e-lcb:#6cc08d; --e-boot:#e9a640; --e-other:#8b97a3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#18202a; --ink:#e3e8ee; --muted:#9aa6b2; --line:#2c3743; --soft:#1f2934;
  --accent:#6cb3ea; --accent-soft:#1b3348;
  --ok:#6cc08d; --warn:#e9a640; --crit:#f07a70; --warn-soft:#3a2d16; --crit-soft:#3d1f1d;
  --e-build:#b39be0; --e-script:#6cb3ea; --e-lcb:#6cc08d; --e-boot:#e9a640; --e-other:#8b97a3;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:20px 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.stamp{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{font:600 .85rem var(--f-body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.box:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:20px 60px}
section.view{display:grid;gap:22px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1rem;margin:0 0 6px}
p{margin:0;max-width:72ch}
.lede{color:var(--muted);max-width:80ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.kpis{display:flex;flex-wrap:wrap;gap:10px 28px}
.kpi b{display:block;font:700 1.35rem var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mono,code{font-family:var(--f-mono);font-size:.8rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;cursor:pointer;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--soft)}
.lnk{color:var(--accent);cursor:pointer;text-decoration:none;background:none;border:0;padding:0;font:inherit;text-align:left;overflow-wrap:anywhere}
.lnk.mono{font-family:var(--f-mono);font-size:.8rem}
.lnk:hover{text-decoration:underline}
.pill{display:inline-block;font:600 .68rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.front{background:var(--crit-soft);color:var(--crit)}
.pill.back{background:var(--warn-soft);color:var(--warn)}
.pill.lib{background:var(--accent-soft);color:var(--accent)}
.sev{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.sev.c{background:var(--crit)}.sev.w{background:var(--warn)}.sev.o{background:var(--ok)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.hot i{background:var(--crit)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
ul.small{margin:4px 0 8px;padding-left:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .78rem var(--f-mono);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 10px}
input[type=search]{min-width:0;flex:1 1 260px}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:.84rem;color:var(--muted)}
.ov-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:16px}
@media (max-width:900px){.ov-wrap{grid-template-columns:1fr}}
.box rect.b{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.box{cursor:pointer}
.box:hover rect.b,.box.sel rect.b{stroke:var(--accent);stroke-width:2.4}
.box text.t{fill:var(--ink);font-weight:700;font-size:12px;font-family:var(--f-display)}
.box text.s{fill:var(--muted);font-size:10.5px;font-family:var(--f-mono)}
.edge{fill:none;stroke-width:1.4;opacity:.12}
.edge.on{opacity:.85;stroke-width:2.2}
.layer-label{fill:var(--muted);font-size:10px;letter-spacing:.12em;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.path-ladder{display:grid;gap:6px}
.rung{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.rung .k{font:700 .78rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rung.front{border-left:4px solid var(--crit)}
.rung.target{border-left:4px solid var(--ok)}
.rung.lib{border-left:4px solid var(--accent)}
.rung.back{border-left:4px solid var(--warn)}
.rung.engine{border-left:4px solid var(--e-build)}
@media (max-width:560px){.rung{grid-template-columns:1fr}}
.boot ol{margin:0;padding-left:1.8em;columns:2 220px;font-family:var(--f-mono);font-size:.8rem}
.sugg{border:1px solid var(--line);border-radius:5px;background:var(--panel);max-height:320px;overflow:auto;margin-top:6px}
.sugg button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 10px;font:inherit;color:var(--ink);cursor:pointer}
.sugg button:hover,.sugg button:focus{background:var(--soft)}
.sugg .ty{font:600 .66rem var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:84px;padding-top:2px}
.check{list-style:none;padding-left:0}
.check li{margin-bottom:5px}
.matrix td{text-align:center;font-variant-numeric:tabular-nums;font-size:.72rem;padding:4px;min-width:34px}
.matrix th{font-size:.62rem;cursor:default}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 5px 5px 0;font-size:.85rem}
.gyp .n rect{fill:var(--panel);stroke:var(--line)}
.gyp .n text{font-size:10px;fill:var(--ink);font-family:var(--f-mono)}
.gyp .n{cursor:pointer}
.gyp .n.sel rect{stroke:var(--accent);stroke-width:2}
.gyp .n.rel rect{stroke:var(--accent)}
.gyp path{fill:none;stroke:var(--e-other);opacity:.25}
.gyp path.on{stroke:var(--accent);opacity:.9}
pre.cmd{white-space:pre-wrap;background:var(--soft);padding:10px;border-radius:5px;overflow-x:auto;margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){.edge{transition:opacity .15s}}
/* Constellation: a deliberately dark "sky" panel in both themes, so the glow reads the same everywhere. */
.sky{--sky:#0a1020;--sky-ink:#e6edf7;--sky-muted:#8fa0b8;--sky-line:#22304a;
  --c-engine:#f2a93b;--c-boot:#ffd166;--c-lib:#5cb8ff;--c-pal:#3dd6c6;--c-ext:#ff6fb5;--c-lcs:#8be07a;--c-res:#7f8ea8;
  position:relative;background:radial-gradient(120% 90% at 20% 40%,#162544 0%,var(--sky) 60%);color:var(--sky-ink);border-radius:8px;overflow:hidden;border:1px solid #1b2740}
.sky canvas{display:block;width:100%;height:600px;cursor:grab}
@media (max-width:700px){.sky canvas{height:460px}}
.sky .cap{position:absolute;left:0;top:0;right:0;padding:18px 20px;pointer-events:none;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.sky .cap h2{font:800 clamp(1.15rem,2.4vw,1.7rem) var(--f-display);color:var(--sky-ink);letter-spacing:-.01em}

.sky .side{position:absolute;left:20px;bottom:16px;right:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:space-between;pointer-events:none}
.sky .legend2{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
.sky .legend2 button{font:600 .72rem var(--f-body);color:var(--sky-ink);background:rgba(255,255,255,.06);border:1px solid var(--sky-line);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.sky .legend2 button[aria-pressed="false"]{opacity:.4}
.sky .legend2 i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
.sky .ctl{pointer-events:auto;display:flex;gap:6px}
.sky .ctl button{font:600 .72rem var(--f-body);color:var(--sky-ink);background:rgba(255,255,255,.08);border:1px solid var(--sky-line);border-radius:5px;padding:5px 10px;cursor:pointer}
.sky .tip{position:absolute;pointer-events:none;background:rgba(8,13,26,.94);border:1px solid var(--sky-line);color:var(--sky-ink);font-size:.78rem;padding:7px 10px;border-radius:6px;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.sky .tip b{font-family:var(--f-mono);font-weight:500;font-size:.76rem;overflow-wrap:anywhere}
.sky .tip .m{color:var(--sky-muted)}
.sky .info{position:absolute;right:20px;top:86px;width:min(320px,calc(100% - 40px));background:rgba(8,13,26,.9);border:1px solid var(--sky-line);border-radius:8px;padding:12px 14px;font-size:.8rem;color:var(--sky-ink)}
.sky .info .lnk{color:#8fd0ff}
.sky .info .m{color:var(--sky-muted)}
/* History */
.lin svg text{font-family:var(--f-body)}
.lin .era{opacity:.16}
.lin .tick{stroke:var(--line)}
.lin .lbl{fill:var(--muted);font-size:11px}
.lin .ver{cursor:pointer}
.lin .ver circle{stroke:var(--panel);stroke-width:1.5}
.lin .ver:hover circle,.lin .ver.sel circle{stroke:var(--ink);stroke-width:2}
.roots{list-style:none;margin:14px 0 4px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:18px 14px;position:relative}
.roots li{position:relative;padding-top:26px;min-width:0}
.roots li::before{content:"";position:absolute;left:0;right:-14px;top:9px;height:3px;background:var(--rc);opacity:.45;border-radius:2px}
.roots li:last-child::before{right:0}
.roots li::after{content:"";position:absolute;left:0;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel);border:3px solid var(--rc);box-sizing:border-box}
.roots .yr{font:800 1.35rem/1 var(--f-display);color:var(--rc);letter-spacing:-.01em}
.roots .nm{font-weight:700;margin:4px 0 2px}
.roots .tx{font-size:.8rem;color:var(--muted);line-height:1.4}
.roots .src{font-size:.72rem;margin-top:4px}
.roots .src a{color:var(--muted)}
.verinfo{min-height:4.5em;border-left:3px solid var(--accent);padding:6px 12px;background:var(--soft);border-radius:0 5px 5px 0;font-size:.85rem}
.act rect.abar{cursor:default}
.act text{font-family:var(--f-body);font-size:10px;fill:var(--muted)}
.act .rel line{stroke:var(--ink);opacity:.35}
.act .rel.stable line{opacity:.9;stroke:var(--accent);stroke-width:1.5}
.act .rel.stable text{fill:var(--accent);font-weight:600}
:root{--g-engine:#c97a10;--g-ide:#1f6aa5;--g-ext:#2f8f5b;--g-build:#7a5aa8;--g-web:#c2416b;--g-docs:#6b7c8f;--g-other:#a7b1bc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-engine:#f2a93b;--g-ide:#5cb8ff;--g-ext:#6cc08d;--g-build:#b39be0;--g-web:#ff7aa2;--g-docs:#93a4b7;--g-other:#5a6673}}
:root[data-theme="dark"]{--g-engine:#f2a93b;--g-ide:#5cb8ff;--g-ext:#6cc08d;--g-build:#b39be0;--g-web:#ff7aa2;--g-docs:#93a4b7;--g-other:#5a6673}
</style>

<header class="top"><div class="wrap">
  <h1>OXT-Beyond Codebase Map</h1>
  <div class="stamp" id="stamp"></div>
</div></header>

<main><div class="wrap" id="views"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const MAP=/*MAP_DATA*/null;
const D=MAP, U=D.units;
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const k of kids.flat(3)){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e}
const fmt=n=>Number(n).toLocaleString('en-US');
const AREA=Object.fromEntries(D.areas.map(a=>[a.id,a]));
const short=p=>p.split('/').pop();
const ROLEPILL=r=>!r?null:h('span',{class:'pill '+(r.startsWith('front')?'front':r.startsWith('back')?'back':'lib')},r.replace(' (start using)',''));
function ulink(id,label){const u=U[id];return h('button',{class:'lnk',title:u.path,onclick:()=>openImpact('unit',id)},label||u.path)}
const BYPATH=Object.fromEntries(U.map(u=>[u.path,u.id]));
function plink(path){return BYPATH[path]!=null?ulink(BYPATH[path]):h('span',{class:'mono'},path)}

function table(cols,rows,opts={}){
  let sortI=opts.sort??null,dir=opts.dir??-1;const limit=opts.limit||400;
  const tb=h('tbody');const thead=h('thead',null,h('tr',null,cols.map((c,i)=>h('th',{class:c.n?'n':null,scope:'col',onclick:()=>{dir=sortI===i?-dir:(c.n?-1:1);sortI=i;draw()}},c.t))));
  const more=h('p',{class:'small muted'});
  function draw(){let rs=rows.slice();if(sortI!=null){const k=cols[sortI].k;rs.sort((a,b)=>{const x=k(a),y=k(b);return (x>y?1:x<y?-1:0)*dir})}
    tb.replaceChildren(...rs.slice(0,limit).map(r=>h('tr',null,cols.map(c=>h('td',{class:c.n?'n':null},c.v?c.v(r):c.k(r))))));
    more.textContent=rs.length>limit?`Showing ${limit} of ${fmt(rs.length)}.`:''}
  draw();return h('div',null,h('div',{class:'scroll'},h('table',null,thead,tb)),more)}

const VIEWS=[['overview','Overview'],['impact','What breaks if I change…'],['ide','IDE scripts'],['engine','Engine'],['build','Build & CI'],['ext','Extensions & Suite'],['history','History'],['hot','Hot spots'],['method','How it was made']];
const built={};
function show(id){for(const[v]of VIEWS){document.getElementById('v-'+v).hidden=v!==id;document.getElementById('t-'+v).setAttribute('aria-selected',v===id)}
  if(!built[id]){built[id]=true;BUILD[id](document.getElementById('v-'+id))}
  try{history.replaceState(null,'','#'+id)}catch(e){}}
const tabs=$('#tabs'),views=$('#views');
for(const[id,t]of VIEWS){tabs.append(h('button',{role:'tab',id:'t-'+id,onclick:()=>show(id)},t));views.append(h('section',{class:'view',id:'v-'+id,hidden:true}))}
$('#stamp').textContent=`main @ ${D.head.split(' ').slice(0,2).join(' ')} · ${fmt(D.files)} tracked files · built ${D.generated}`;
const BUILD={};
const svgNS='http://www.w3.org/2000/svg';const S=(t,a)=>{const e=document.createElementNS(svgNS,t);for(const k in a)e.setAttribute(k,a[k]);return e};

/* ---------- Constellation: engine subsystems and IDE scripts ---------- */
const SKYAREAS={'ide-boot':['IDE start-up','--c-boot'],'ide-lib':['IDE libraries','--c-lib'],'ide-palette':['Palettes & dialogs','--c-pal'],'ide-ext':['Plugins','--c-ext'],'lcs-ext':['Script libraries','--c-lcs'],'ide-resources':['Examples & help stacks','--c-res']};
function constellation(host){
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wrap=h('div',{class:'sky'});const cv=h('canvas',{role:'img','aria-label':'Network of engine subsystems and IDE scripts with the links between them'});
  const tip=h('div',{class:'tip',hidden:true});const info=h('div',{class:'info',hidden:true});
  const nIDE=U.filter(u=>SKYAREAS[u.area]&&(u.fanin||u.fanout)).length;
  const nMsgLinks=D.intercepts.reduce((s,m)=>s+m.units.length,0);
  wrap.append(cv,h('div',{class:'cap'},h('div',null,h('h2',null,'How the engine and the IDE hold together'),
    h('p',null,`${D.engine.subsystems.length} engine subsystems (amber, left) and ${nIDE} IDE scripts (right), sized by how much depends on them. Lines are real links: #includes, script calls and stack references, and the engine messages and properties the IDE handles. Sparks travel the engine-to-IDE links. Hover, drag, or click a star.`))),tip,info);
  const groups=Object.keys(SKYAREAS).concat(['engine']);const on=Object.fromEntries(groups.map(g=>[g,true]));
  const legend=h('div',{class:'legend2'},[['engine','Engine subsystems','--c-engine'],...Object.entries(SKYAREAS).map(([k,[l,c]])=>[k,l,c])].map(([k,l,c])=>{const b=h('button',{'aria-pressed':'true',onclick:()=>{on[k]=!on[k];b.setAttribute('aria-pressed',on[k]);if(!running)draw()}},h('i',{style:`background:var(${c});color:var(${c})`}),l);return b}));
  const pauseBtn=h('button',{type:'button'},reduce?'Play sparks':'Pause sparks');
  wrap.append(h('div',{class:'side'},legend,h('div',{class:'ctl'},pauseBtn)));
  host.append(wrap);
  const css=getComputedStyle(wrap);const col=v=>css.getPropertyValue(v).trim();
  // nodes
  const nodes=[],byKey={};
  for(const s of D.engine.subsystems){const n={key:'e:'+s.id,label:s.id,kind:'engine',area:'engine',r:6+Math.sqrt(s.lines/1000)*1.9,info:`${fmt(s.files)} files · ${fmt(s.lines)} lines of C++`};nodes.push(n);byKey[n.key]=n}
  for(const u of U){if(!SKYAREAS[u.area]||!(u.fanin||u.fanout))continue;const n={key:'u:'+u.id,uid:u.id,label:short(u.path),kind:'script',area:u.area,r:2.2+Math.sqrt(u.fanin)*1.25,info:`${u.fanin} scripts depend on it · ${u.lines} lines`+(u.role?` · ${u.role}`:'')};nodes.push(n);byKey[n.key]=n}
