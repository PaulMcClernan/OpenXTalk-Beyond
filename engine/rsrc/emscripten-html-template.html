<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@STACK_TITLE@</title>
    <style>
      body {
        margin: 0;
        background-color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* The main stack's window.  The engine sets its size to the
         stack's. */
      #stack {
        margin: 0 auto;
      }

      /* The canvas must have no border or padding, or the mouse
         position will be wrong. */
      #canvas {
        display: block;
        border: 0 none;
        padding: 0;
        outline: none;
      }

      #status {
        padding: 16px;
        text-align: center;
        color: #666666;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading...</div>
    <noscript><div>This page needs JavaScript.</div></noscript>

    <div id="stack">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <script>
      var statusElement = document.getElementById('status');

      var Module = {
        // The canvas of the main stack's window
        canvas: document.getElementById('canvas'),

        // Where "write ... to stdout" and "write ... to stderr" go
        print: function(text) {
          console.log(text);
        },
        printErr: function(text) {
          console.error(text);
        },

        // Shows what is loading; empty when the engine has started
        setStatus: function(text) {
          statusElement.textContent = text;
          statusElement.style.display = text ? 'block' : 'none';
        },
      };

      // An error of the page's own (a script's of the page's site, or the
      // engine's WebAssembly's) says something went wrong. Another
      // script's is not the stack's: a browser extension's in the page, or
      // another site's ("Script error.", with no file), put the message
      // over a stack that was running well before OXT-Beyond 0.2.7-rc.6.15
      function oxtOwnError(e) {
        var file = String(e.filename || '');
        var site = location.protocol === 'file:' ? 'file:' : location.origin + '/';
        if (e.error && typeof WebAssembly === 'object' &&
            (e.error instanceof WebAssembly.RuntimeError ||
             e.error instanceof WebAssembly.CompileError ||
             e.error instanceof WebAssembly.LinkError)) {
          return true;
        }
        return file !== '' && (file.indexOf(site) === 0 || file.indexOf('wasm:') === 0);
      }

      window.addEventListener('error', function(e) {
        if (!oxtOwnError(e)) {
          console.warn('An error that is not the page\'s own: ' +
                       (e.message || 'an error') + (e.filename ? ' (' + e.filename + ')' : ''));
          return;
        }
        Module.setStatus('Something went wrong. The browser console has the details.');
        // The engine's own JavaScript not understood: a browser older
        // than the engine needs (an iPhone or an iPad before iOS 15)
        if (e.error instanceof SyntaxError && oxtTooOld()) {
          showStopped(oxtTooOldText);
        }
      });

      // Whether the browser is older than the engine needs: Safari 15 (iOS
      // 15) is the first Safari with what the engine uses, BigInt64Array
      // among it. A newer browser that cannot read the engine has a
      // damaged file, or a server that sent something else in its place.
      function oxtTooOld() {
        return typeof BigInt64Array == 'undefined';
      }
      var oxtTooOldText = 'This browser is too old to run the stack: it needs Safari 15 or later ' +
        '(iOS 15 or later on an iPhone or an iPad), or an up-to-date Chrome, Edge or Firefox.';

      // A note above everything, with the browser's own words and which
      // browser it is, so that whoever sees it can tell what happened:
      // the canvas covers the status once the engine has started.
      function showStopped(text) {
        if (document.getElementById('stopped')) {
          return;
        }
        var note = document.createElement('div');
        note.id = 'stopped';
        note.setAttribute('role', 'alert');
        note.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483647;padding:16px 20px;' +
          'background:#fff4f0;color:#7a1d00;border-bottom:2px solid #e8590c;' +
          'font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:left';
        note.textContent = text + ' (' + navigator.userAgent + ')';
        document.body.appendChild(note);
      }

      // When the engine itself stops (it ran out of the browser's stack,
      // as on an iPhone or an iPad, which give a page far less than a
      // desktop, or WebAssembly failed), it does so in a promise that
      // nothing catches, and the page stayed blank. Only the engine's own
      // count, as oxtOwnError has it: a RangeError raised in its
      // WebAssembly (whose stack names wasm functions), or a
      // WebAssembly.RuntimeError. Other unhandled rejections (a stack's
      // own JavaScript, a browser extension's) are left as they were.
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var stopped = (reason instanceof RangeError && /wasm/.test(String(reason.stack || ''))) ||
          (typeof WebAssembly == 'object' && WebAssembly.RuntimeError && reason instanceof WebAssembly.RuntimeError);
        if (stopped) {
          var said = reason.message || String(reason);
          if (!/CompileError/.test(said)) {
            showStopped('The stack stopped in this browser: ' + said);
          } else if (oxtTooOld()) {
            showStopped(oxtTooOldText + ' (' + said + ')');
          } else {
            showStopped('This browser could not read the engine: its .wasm file is damaged, or the server ' +
              'sent something else in its place. Upload the files again as they were built. (' + said + ')');
          }
        }
      });

      // A browser without WebAssembly cannot run the engine at all, and
      // the page said "Loading..." for ever. An iPhone's or an iPad's
      // Lockdown Mode turns WebAssembly off.
      if (typeof WebAssembly != 'object') {
        showStopped('This browser cannot run the stack: WebAssembly is turned off in it. ' +
          'On an iPhone or an iPad, Lockdown Mode turns it off, and Safari can leave this site out of Lockdown Mode.');
      }
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
