<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@STACK_TITLE@</title>
    <style>
      body {
        margin: 0;
        background-color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* The main stack's window.  The engine sets its size to the
         stack's. */
      #stack {
        margin: 0 auto;
      }

      /* The canvas must have no border or padding, or the mouse
         position will be wrong. */
      #canvas {
        display: block;
        border: 0 none;
        padding: 0;
        outline: none;
      }

      #status {
        padding: 16px;
        text-align: center;
        color: #666666;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading...</div>
    <noscript><div>This page needs JavaScript.</div></noscript>

    <div id="stack">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <script>
      var statusElement = document.getElementById('status');

      var Module = {
        // The canvas of the main stack's window
        canvas: document.getElementById('canvas'),

        // Where "write ... to stdout" and "write ... to stderr" go
        print: function(text) {
          console.log(text);
        },
        printErr: function(text) {
          console.error(text);
        },

        // Shows what is loading; empty when the engine has started
        setStatus: function(text) {
          statusElement.textContent = text;
          statusElement.style.display = text ? 'block' : 'none';
        },
      };

      window.addEventListener('error', function() {
        Module.setStatus('Something went wrong. The browser console has the details.');
      });
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
